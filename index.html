    function approveAllPendingViaLine() {
      const pendingLeave = App.liff.requests.filter(r => r.status === 'PENDING');
      const pendingPunch = App.attendance.corrections.filter(c => c.status === 'PENDING');
      const total = pendingLeave.length + pendingPunch.length;
      if (total === 0) { App.toast = '目前沒有待簽核項目。'; render(); return; }
      const ap = getActiveLineApprover();
      pendingLeave.forEach(r => managerSignOff(r.id, 'APPROVED', true));
      pendingPunch.forEach(c => reviewMissedPunch(c.id, 'APPROVED', true));
      App.toast = ap.isDelegated
        ? `值班副店長 ${ap.name} 已透過 LINE 代理核准 ${total} 筆簽核單，班表、假別與薪資已同步更新。`
        : `店長已透過 LINE 一鍵核准 ${total} 筆簽核單，班表、假別與薪資已同步更新。`;
      render();
    }

    // Attendance
    function calcWorkedLabel(inStr, outStr) {
      if (!inStr || !outStr) return '— (漏卡)';
      const [ih, im] = inStr.split(':').map(Number), [oh, om] = outStr.split(':').map(Number);
      const mins = (oh * 60 + om) - (ih * 60 + im);
      return mins <= 0 ? '—' : `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2,'0')}m`;
    }

    function doLiveClockPunch(kind) {
      const emp = App.employees.find(e => e.id === App.attendance.liffEmpId);
      const now = new Date();
      const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const today = '2026-11-21';
      let existing = App.attendance.logs.find(l => l.employeeId === emp.id && l.date === today);
      if (!existing) {
        App.attendance.logs.unshift({
          id: 'log-' + Date.now(), employeeId: emp.id, date: today, scheduled: '08:30–17:00',
          clockIn: kind === 'IN' ? hhmm : '', clockOut: kind === 'OUT' ? hhmm : '',
          method: 'LINE GPS (12m) + Wi-Fi', lateM: 0, status: kind === 'IN' ? 'NORMAL' : 'MISSING_IN', note: `今日 ${hhmm} 打卡`
        });
      } else {
        if (kind === 'IN') existing.clockIn = hhmm;
        if (kind === 'OUT') existing.clockOut = hhmm;
        if (existing.clockIn && existing.clockOut) existing.status = existing.lateM > 0 ? 'LATE' : 'NORMAL';
      }
      App.toast = `${emp.name} 已於 ${hhmm} 完成${kind === 'IN' ? '上班打卡' : '下班簽退'}（GPS 12m 驗證通過）。`;
      render();
      pushStoreToCloud(App.multiStore.activeStoreId);
    }

    function prefillMissedPunch(empId, date, missingType, existingIn, existingOut) {
      App.attendance.liffEmpId = empId;
      App.attendance.phoneTab = 'MISSED_FORM';
      App.attendance.draft = { date, type: missingType, reqIn: existingIn || '08:30', reqOut: existingOut || '17:00', witnessId: App.employees.find(e => e.id !== empId)?.id || 'emp-01', reason: '' };
      App.liffDrawerOpen = true;
      App.toast = '已帶入異常日期至 LINE LIFF 補卡表單。';
      render();
    }

    function submitMissedPunch(e) {
      e.preventDefault();
      const emp = App.employees.find(x => x.id === App.attendance.liffEmpId), d = App.attendance.draft;
      const wit = App.employees.find(x => x.id === d.witnessId);
      const matchLog = App.attendance.logs.find(l => l.employeeId === emp.id && l.date === d.date);
      App.attendance.corrections.unshift({
        id: 'mp-' + Date.now(), logId: matchLog ? matchLog.id : '', employeeId: emp.id, date: d.date, type: d.type, reqIn: d.reqIn, reqOut: d.reqOut,
        witnessName: wit ? `${wit.name}` : '當班主管', reason: d.reason.trim() || '門市尖峰忙碌漏刷卡',
        evidence: '附當班主管見證與出勤比對', status: 'PENDING', managerNote: '', createdAt: '剛剛 via LINE LIFF',
      });
      App.attendance.draft.reason = '';
      App.toast = `${emp.name} 已送出 ${d.date} 補卡申請至簽核中心。`;
      render();
    }

    function reviewMissedPunch(mpId, decision, viaLine) {
      const req = App.attendance.corrections.find(c => c.id === mpId);
      if (!req || req.status !== 'PENDING') return;
      const ap = getActiveLineApprover(App.sched.selectedDate);
      const noteEl = document.getElementById((viaLine ? 'line-mp-note-' : 'mp-note-') + mpId);
      req.status = decision;
      if (viaLine) req.signedVia = 'LINE';
      req.signedBy = `${ap.name} (${ap.roleLabel})`;
      req.managerNote = (noteEl && noteEl.value.trim()) || (decision === 'APPROVED'
        ? (viaLine ? (ap.isDelegated ? `已由代理副店長 ${ap.name} 透過 LINE 核准補登` : '已透過 LINE 核對無誤，准予補登') : '核對無誤，准予補登')
        : (viaLine ? (ap.isDelegated ? `已由代理副店長 ${ap.name} 透過 LINE 駁回補登` : '已透過 LINE 駁回，時間與紀錄不符') : '時間與紀錄不符'));
      const emp = App.employees.find(e => e.id === req.employeeId);
      if (decision === 'APPROVED') {
        let log = App.attendance.logs.find(l => l.id === req.logId || (l.employeeId === req.employeeId && l.date === req.date));
        if (log) {
          if (req.type === 'MISSING_IN' || req.type === 'BOTH') log.clockIn = req.reqIn;
          if (req.type === 'MISSING_OUT' || req.type === 'BOTH') log.clockOut = req.reqOut;
          log.status = 'CORRECTED'; log.note = `已補卡核准`;
        }
        App.toast = `已核准 ${emp.name} (${req.date}) 補卡申請，出勤與薪資全勤判定已同步修復。`;
      } else { App.toast = `已駁回 ${emp.name} 之補卡申請。`; }
      render();
    }

    function getFilteredAttendanceLogs() {
      const a = App.attendance;
      const from = (a.filterDateFrom || '').trim();
      const to = (a.filterDateTo || '').trim();
      return (a.logs || []).filter(l => {
        if (a.filterEmp !== 'ALL' && l.employeeId !== a.filterEmp) return false;
        if (a.searchDate && l.date !== a.searchDate) return false;
        if (from && l.date < from) return false;
        if (to && l.date > to) return false;
        if (a.filterStatus === 'ANOMALY') return l.status === 'MISSING_IN' || l.status === 'MISSING_OUT' || l.status === 'LATE';
        if (a.filterStatus !== 'ALL') return l.status === a.filterStatus;
        return true;
      });
    }

    function applyAttendanceDateFilter() {
      let from = (App.attendance.draftDateFrom || '').trim();
      let to = (App.attendance.draftDateTo || '').trim();
      if (from && to && from > to) {
        const tmp = from; from = to; to = tmp;
        App.attendance.draftDateFrom = from;
        App.attendance.draftDateTo = to;
      }
      App.attendance.filterDateFrom = from;
      App.attendance.filterDateTo = to;
      render();
    }

    function setAttendanceDatePreset(preset) {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      let from = '', to = '';
      if (preset === 'LAST_7') {
        const start = new Date(now);
        start.setDate(start.getDate() - 6);
        from = fmt(start);
        to = fmt(now);
      } else if (preset === 'THIS_MONTH') {
        const y = now.getFullYear(), m = now.getMonth();
        from = fmt(new Date(y, m, 1));
        to = fmt(new Date(y, m + 1, 0));
      } else if (preset === 'PREV_MONTH') {
        const y = now.getFullYear(), m = now.getMonth() - 1;
        from = fmt(new Date(y, m, 1));
        to = fmt(new Date(y, m + 1, 0));
      }
      App.attendance.draftDateFrom = from;
      App.attendance.draftDateTo = to;
      App.attendance.filterDateFrom = from;
      App.attendance.filterDateTo = to;
      render();
    }

    function exportAttendanceCsv() {
      const headers = ['出勤日期', '員工編號', '員工姓名', '排定班次', '實際上班', '實際下班', '實計工時', '驗證方式', '狀態備註'];
      const filtered = getFilteredAttendanceLogs();
      const rows = filtered.map(l => {
        const e = App.employees.find(x => x.id === l.employeeId) || { code: '', name: '' };
        return [l.date, e.code, e.name, l.scheduled, l.clockIn || '未打卡', l.clockOut || '未打卡', calcWorkedLabel(l.clockIn, l.clockOut), l.method, l.note];
      });
      const csv = '\uFEFF' + [headers, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const from = App.attendance.filterDateFrom || '';
      const to = App.attendance.filterDateTo || '';
      const rangeTag = (from || to) ? `${from || '起'}_至_${to || '迄'}` : new Date().toISOString().slice(0, 7);
      const a = document.createElement('a'); a.href = url; a.download = `ShiftCraft_勞基法出勤紀錄_${rangeTag}.csv`; a.click(); URL.revokeObjectURL(url);
      App.toast = `已匯出 ${filtered.length} 筆符合勞基法第 30 條之出勤紀錄 CSV。`;
      render();
    }

    const BANK_PAYROLL_FORMATS = [
      { code: 'GENERIC', short: '通用企業網銀', label: '通用企業網銀薪轉格式 (全銀行適用)' },
      { code: 'CTBC', short: '中國信託 822', label: '中國信託 e-Cash 整批薪轉 (822)' },
      { code: 'CATHAY', short: '國泰世華 013', label: '國泰世華 MyB2B 企業薪轉 (013)' },
      { code: 'ESUN', short: '玉山銀行 808', label: '玉山銀行 企業網銀整批薪轉 (808)' },
      { code: 'TAISHIN', short: '台新銀行 812', label: '台新銀行 企業網銀薪轉 (812)' },
    ];

    function getDefaultPayDate(monthKey) {
      const [y, m] = (monthKey || '2026-11').split('-').map(Number);
      const nextY = m === 12 ? y + 1 : y;
      const nextM = m === 12 ? 1 : m + 1;
      return `${nextY}-${String(nextM).padStart(2, '0')}-05`;
    }

    function csvEscapeCell(val) {
      const s = String(val == null ? '' : val).replace(/\r?\n/g, ' ');
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function getPayrollBankRows(monthKey) {
      const mk = monthKey || App.payroll.monthKey;
      return App.employees.map((e, idx) => {
        const slip = calcPayslip(e, ensurePayrollAtt(mk, e), mk);
        const bankCode = String(e.bankCode || '').trim();
        const bankName = String(e.bankName || (TAIWAN_BANKS.find(b => b.code === bankCode)?.name || '')).trim();
        const accountNumber = String(e.accountNumber || '').replace(/[\s-]/g, '').trim();
        const holderName = String(e.accountHolder || (e.nationalityType === 'FOREIGN' && e.passportEnglishName ? e.passportEnglishName : e.name) || '').trim();
        const nationalId = String(e.nationalId || '').trim().toUpperCase();
        const issues = [];
        if (!bankCode) issues.push('缺少銀行代碼');
        if (!accountNumber) issues.push('缺少薪轉帳號');
        if (slip.netPay <= 0) issues.push('實發金額為 $0');
        return {
          seq: idx + 1,
          slip,
          emp: e,
          holderName,
          bankCode,
          bankName,
          accountNumber,
          nationalId,
          netPay: slip.netPay,
          valid: issues.length === 0,
          issueText: issues.join('、'),
        };
      });
    }

    function exportPayrollBankCsv() {
      const mk = App.payroll.monthKey;
      const fmtCode = App.payroll.bankExportFormat || 'GENERIC';
      const fmtMeta = BANK_PAYROLL_FORMATS.find(f => f.code === fmtCode) || BANK_PAYROLL_FORMATS[0];
      const payDate = App.payroll.bankPayDate || getDefaultPayDate(mk);
      const payDateCompact = payDate.replace(/-/g, '');
      const memo = `${mk} 薪資`;
      const allRows = getPayrollBankRows(mk);
      const targetRows = App.payroll.bankOnlyValid ? allRows.filter(r => r.valid) : allRows;

      if (targetRows.length === 0) {
        App.toast = '目前沒有符合條件的可轉帳資料，請先至人資建檔補齊員工銀行帳號。';
        render();
        return;
      }

      let headers = [];
      let rows = [];
      if (fmtCode === 'CTBC') {
        headers = ['入帳日期(YYYYMMDD)', '收款銀行代碼', '收款人帳號', '收款人戶名', '轉帳金額', '身分證統一編號', '員工編號', '備註附言'];
        rows = targetRows.map(r => [payDateCompact, r.bankCode, r.accountNumber, r.holderName, r.netPay, r.nationalId, r.emp.code, memo]);
      } else if (fmtCode === 'CATHAY') {
        headers = ['付款日期', '收款銀行代號', '收款帳號', '收款人戶名', '身分證字號', '交易金額', '附言'];
        rows = targetRows.map(r => [payDateCompact, r.bankCode, r.accountNumber, r.holderName, r.nationalId, r.netPay, memo]);
      } else if (fmtCode === 'ESUN') {
        headers = ['銀行代碼', '收款帳號', '戶名', '轉帳金額', '身分證/統一證號', '入帳日期', '摘要'];
        rows = targetRows.map(r => [r.bankCode, r.accountNumber, r.holderName, r.netPay, r.nationalId, payDateCompact, memo]);
      } else if (fmtCode === 'TAISHIN') {
        headers = ['入帳日', '銀行代號', '收款帳號', '收款戶名', '金額', '身分證字號', '備註'];
        rows = targetRows.map(r => [payDateCompact, r.bankCode, r.accountNumber, r.holderName, r.netPay, r.nationalId, memo]);
      } else {
        headers = ['序號', '入帳日期', '員工編號', '員工姓名', '收款人戶名', '身分證/居留證號', '收款銀行代碼', '收款銀行名稱', '收款帳號', '實發轉帳金額', '摘要附言'];
        rows = targetRows.map((r, i) => [i + 1, payDate, r.emp.code, r.emp.name, r.holderName, r.nationalId, r.bankCode, r.bankName, r.accountNumber, r.netPay, memo]);
      }

      const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(csvEscapeCell).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ShiftCraft_銀行薪轉_${mk}_${fmtCode}.csv`;

    function _parseTimeToHour(hhmm) {
      const m = String(hhmm || '09:00').match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return 9;
      return parseInt(m[1], 10) + parseInt(m[2], 10) / 60;
    }
    function syncShiftTemplatesCatalog() {
      const list = Array.isArray(App.storeSettings.shiftTemplates) ? App.storeSettings.shiftTemplates : [];
      // 保留系統固定休假模板，清除舊的上班模板後重新寫入
      const sysOffCodes = ['OFF_REG', 'OFF_REST', 'OFF_HOLIDAY', 'OFF_HOLIDAY_COMP'];
      const savedOff = {};
      sysOffCodes.forEach(c => {
        if (SHIFT_TEMPLATES[c]) savedOff[c] = SHIFT_TEMPLATES[c];
      });
      Object.keys(SHIFT_TEMPLATES).forEach(k => delete SHIFT_TEMPLATES[k]);
      list.forEach(t => {
        if (!t || !t.code) return;
        const sh = _parseTimeToHour(t.startTime);
        let eh = _parseTimeToHour(t.endTime);
        const isOvernight = eh <= sh;
        if (isOvernight) eh += 24;
        const brkH = Math.max(0, Number(t.breakMins) || 0) / 60;
        const netHours = Math.max(0.5, Math.round((eh - sh - brkH) * 10) / 10);
        SHIFT_TEMPLATES[t.code] = {
          code: t.code,
          name: t.name,
          shortLabel: t.name.slice(0, 6),
          timeRange: `${t.startTime}-${t.endTime}${isOvernight ? ' (+1)' : ''}`,
          startHour: sh,
          endHour: eh,
          netHours,
          isOff: false,
          isOvernight,
        };
      });
      sysOffCodes.forEach(c => {
        if (savedOff[c]) SHIFT_TEMPLATES[c] = savedOff[c];
      });
    }

    // ============================================================================
    // 模組 1：排班時間軸 (緊湊日期條 + 餐期底紋 + 工作站色條)
    // ============================================================================
    function renderSchedulingModule() {
      const ev = evalSchedule();
      const errCnt = ev.issues.filter(i => i.severity === 'ERROR').length;
      const warnCnt = ev.issues.filter(i => i.severity === 'WARNING').length;
      const weekDays = getVisibleWeekDays();
      const selDate = weekDays.some(f => f.date === App.sched.selectedDate) ? App.sched.selectedDate : weekDays[0].date;
      App.sched.selectedDate = selDate;
      const selForecast = weekDays.find(f => f.date === selDate) || weekDays[0];
      const dayCfg = getEffectiveDayConfig(selDate);

      const activeEmps = getSchedulableEmployees();
      const dayStats = {};
      weekDays.forEach(f => {
        const isClosed = getEffectiveDayConfig(f.date).isClosed;
        const working = isClosed ? [] : activeEmps.filter(e => {
          const s = App.sched.shifts.find(x => x.employeeId === e.id && x.date === f.date);
          return s && SHIFT_TEMPLATES[s.shiftCode] && !SHIFT_TEMPLATES[s.shiftCode].isOff;
        });
        const dayHours = working.reduce((acc, e) => acc + getShiftNetHours(App.sched.shifts.find(x => x.employeeId === e.id && x.date === f.date)), 0);
        dayStats[f.date] = { count: working.length, hours: dayHours, isClosed };
      });
      const curDayStat = dayStats[selDate] || { count: 0, hours: 0, isClosed: false };

      const axis = getStoreScheduleAxis();
      const AXIS_START = axis.start, AXIS_END = axis.end, AXIS_SPAN = axis.span;
      const AXIS_TICKS = axis.ticks;
      const clipZone = (s, e, label) => {
        const cs = Math.max(AXIS_START, s), ce = Math.min(AXIS_END, e);
        if (ce <= cs) return null;
        return { left: ((cs - AXIS_START) / AXIS_SPAN) * 100, width: ((ce - cs) / AXIS_SPAN) * 100, label };
      };
      // 深夜跨夜時段 (00:00-06:00, 22:00-30:00) 與店鋪自訂尖峰標記
      const nightZones = [
        clipZone(0, 6, '跨夜 / 凌晨'),
        clipZone(22, 30, '跨夜'),
      ].filter(Boolean);
      const peakZones = (App.storeSettings.peakHours || []).map(p => {
        const sh = parseHourStr(p.start);
        let eh = parseHourStr(p.end);
        if (sh == null || eh == null) return null;
        if (eh <= sh) eh += 24;
        return clipZone(sh, eh, p.label || '尖峰');
      }).filter(Boolean);

      const selIdx = weekDays.findIndex(f => f.date === selDate);
      const prevDtObj = _parseYmd(selDate);
      prevDtObj.setDate(prevDtObj.getDate() - 1);
      const prevDate = _fmtYmd(prevDtObj);
      const prevClosed = getEffectiveDayConfig(prevDate).isClosed;

      const dayRows = activeEmps.map(emp => {
        const shift = App.sched.shifts.find(x => x.employeeId === emp.id && x.date === selDate);
        const segments = dayCfg.isClosed ? [] : getShiftSegments(shift);
        const carrySegments = [];
        if (prevDate && !prevClosed && !dayCfg.isClosed) {
          const prevShift = App.sched.shifts.find(x => x.employeeId === emp.id && x.date === prevDate);
          const prevSegs = getShiftSegments(prevShift);
          prevSegs.forEach(ps => {
            if (ps.end > 24) {
              const tailEnd = Math.min(24, ps.end - 24);
              if (tailEnd > AXIS_START) {
                carrySegments.push({ start: Math.max(0, AXIS_START), end: Math.min(AXIS_END, tailEnd), isCarryOver: true, prevDate, station: prevShift ? prevShift.station : null, label: `前日跨夜 00:00–${fmtHour(tailEnd)}` });
              }
            }
          });
        }
        const hours = dayCfg.isClosed ? 0 : getShiftNetHours(shift);
        return { emp, shift, segments, carrySegments, hours, isWorking: segments.length > 0 || carrySegments.length > 0 };
      }).filter(row => App.sched.showOffStaff ? true : row.isWorking);

      const slotHeadcounts = AXIS_TICKS.map(tick => {
        const mid = tick + axis.step / 2;
        return {
          tick,
          count: dayRows.filter(r =>

    function signPayrollPayslip(mk, empId) {
      const emp = App.employees.find(e => e.id === empId);
      const now = new Date();
      const ts = `2026-11-21 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      App.payroll.dispatched[mk + '_' + empId] = true;
      App.payroll.signed[mk + '_' + empId] = ts;
      App.toast = `${emp ? emp.name : ''} 已透過 LINE LIFF 完成 ${mk} 電子薪資條確認簽回（${ts}）。`;
      render();
    }

                        `;

      const f = App.hr.form;
      const isF = f.nationalityType === 'FOREIGN';
      const fixedM = getHrEstimatedMonthly(f);
      const taxRate = (isF && !f.isTaxResident183Days) ? (fixedM <= 44250 ? 6 : 18) : 0;
      const mEl = document.getElementById('hr-live-monthly');
      if (mEl) mEl.textContent = 'NT$' + fixedM.toLocaleString();
      const tEl = document.getElementById('hr-live-tax');
      if (tEl) {
        tEl.textContent = '所得稅預扣率：' + taxRate + '%';
        tEl.className = taxRate > 0 ? 'text-rose-600' : 'text-[#0F766E]';
      }
      // 依預估月薪自動帶入勞保與健保級距（若人資已手動指定則保留原選擇）
      if (!f.laborBracketManual) {
        f.laborBracket = matchLaborBracket(fixedM, f.type);
        const lbSel = document.getElementById('hr-labor-bracket-select');
        if (lbSel) lbSel.value = String(f.laborBracket);
      }
      if (!f.nhiBracketManual) {
        f.nhiBracket = matchNhiBracket(fixedM);
        const nbSel = document.getElementById('hr-nhi-bracket-select');
        if (nbSel) nbSel.value = String(f.nhiBracket);
      }
      const idEl = document.getElementById('hr-id-validation');
      if (idEl) {
        const v = validateIdOrArc(f.nationalId);
        if (v) {
          idEl.textContent = v.msg;
          idEl.className = 'text-[11px] font-semibold mt-1 ' + (v.valid ? 'text-emerald-600' : 'text-rose-600');
        } else {
          idEl.textContent = '';
        }
      }
    }

    function translateText(raw, lang) {
      if (!raw || lang === 'zh-TW' || !/[\u4e00-\u9fff]/.test(raw)) return raw;
      const mLead = raw.match(/^\s*/)[0];
      const mTrail = raw.match(/\s*$/)[0];
      const core = raw.trim();
      if (!core) return raw;

      const exact = I18N_EXACT[core];
      if (exact && exact[lang]) return mLead + exact[lang] + mTrail;

      for (const [re, tpl] of I18N_PATTERNS) {
        if (re.test(core)) {
          let out = core.replace(re, tpl[lang]);
          for (const [zh, en, ja] of I18N_TERMS) {
            if (out.includes(zh)) out = out.split(zh).join(lang === 'en' ? en : ja);
          }
          return mLead + out + mTrail;
        }
      }

      let out = core;
      let changed = false;
      for (const [zh, en, ja] of I18N_TERMS) {
        if (out.includes(zh)) {
          out = out.split(zh).join(lang === 'en' ? en : ja);
          changed = true;
        }
      }
      return changed ? mLead + out + mTrail : raw;
    }

    function translateAppDom(root, lang) {
      document.documentElement.lang = lang;
      document.title = translateText('班匠 ShiftCraft AI｜台灣餐飲營運與智慧排班平台', lang);
      if (!root || lang === 'zh-TW') return;

      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const p = node.parentElement;
          if (!p) return NodeFilter.FILTER_REJECT;
          if (p.closest('[data-no-i18n="1"]')) return NodeFilter.FILTER_REJECT;
          const tag = p.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
          return /[\u4e00-\u9fff]/.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
        },
      });
      const textNodes = [];
      let n;
      while ((n = walker.nextNode())) textNodes.push(n);
      for (const tn of textNodes) {
        const next = translateText(tn.nodeValue, lang);
        if (next !== tn.nodeValue) tn.nodeValue = next;
      }

      const attrEls = root.querySelectorAll('[placeholder], [title], [aria-label]');
      for (const el of attrEls) {
        if (el.closest('[data-no-i18n="1"]')) continue;
        for (const attr of ['placeholder', 'title', 'aria-label']) {
          const val = el.getAttribute(attr);
          if (val && /[\u4e00-\u9fff]/.test(val)) {
            const next = translateText(val, lang);
            if (next !== val) el.setAttribute(attr, next);
          }
        }
      }
    }

    function setAppLang(lang) {
      App.lang = ['zh-TW', 'en', 'ja'].includes(lang) ? lang : 'zh-TW';
      render();
    }

    // 右下角浮動 Toast 出現 10 秒後自動消失
    let _toastValue = App.toast;
    let _toastTimer = null;
    Object.defineProperty(App, 'toast', {
      configurable: true,
      enumerable: true,
      get() { return _toastValue; },
      set(val) {
        _toastValue = val || null;
        if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
        if (_toastValue) {
          _toastTimer = setTimeout(() => {
            _toastValue = null;
            _toastTimer = null;
            const el = document.getElementById('app-toast');
            if (el) el.remove();
          }, 10000);
        }
      },
    });

    const _origRender = render;
    render = function() {
      _origRender();
      translateAppDom(document.getElementById('app'), App.lang);
      try {
        const activeMeta = App.multiStore.stores.find(s => s.id === App.multiStore.activeStoreId);
        if (activeMeta && App.storeSettings.name) activeMeta.name = App.storeSettings.name;

          employees: App.employees,
          sched: { shifts: App.sched.shifts, dayConfig: App.sched.dayConfig },

            stores: App.multiStore.stores,

      } catch (e) {}
