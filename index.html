    function evalSchedule() {
      const issues = [];
      const summaries = {};
      let totalHours = 0, totalCost = 0, otCost = 0;

      for (const emp of App.employees) {
        const empShifts = FORECASTS.map(f =>
          App.sched.shifts.find(s => s.employeeId === emp.id && s.date === f.date) ||
          { employeeId: emp.id, date: f.date, shiftCode: 'OFF_REST', station: emp.stations[0] || 'BAR', aiReason: '待排班' }
        );
        let h = 0, days = 0, streak = 0, maxStreak = 0, hasErr = false;

        for (let i = 0; i < empShifts.length; i++) {
          const cur = empShifts[i];
          const tpl = SHIFT_TEMPLATES[cur.shiftCode];
          if (!tpl.isOff) { days++; h += getShiftNetHours(cur); streak++; if (streak > maxStreak) maxStreak = streak; }
          else streak = 0;

          if (i > 0) {
            const prev = empShifts[i - 1];
            const pTpl = SHIFT_TEMPLATES[prev.shiftCode];
            if (!pTpl.isOff && !tpl.isOff) {
              const restH = 24 - pTpl.endHour + tpl.startHour;
              if (restH < 11) {
                hasErr = true;
                issues.push({
                  severity: 'ERROR', law: '勞基法第 34 條 (輪班間隔≥11h)', empId: emp.id, date: cur.date,
                  title: `${emp.name} 跨日輪班僅休息 ${restH.toFixed(1)}h（未滿 11 小時）`,
                  fix: `AI 可自動將 ${cur.date.slice(5)} 改為晚班，使休息間隔增至 15.5h。`
                });
              }
            }
          }
        }
        if (maxStreak >= 7) {
          hasErr = true;
          issues.push({
            severity: 'ERROR', law: '勞基法第 36 條 (一例一休禁連七)', empId: emp.id, date: '2026-11-29',
            title: `${emp.name} 本週連續出勤達 ${maxStreak} 天`,
            fix: 'AI 可自動於週四與週日排入休息日/例假，由多能工莎莉與鄭宇翔補位內場。'
          });
        }
        if (emp.nationalityType === 'FOREIGN' && emp.foreignStatusType === 'STUDENT_PT' && h > 20) {
          issues.push({
            severity: 'WARNING', law: '就服法第 50 條提醒（不鎖定排班）', empId: emp.id, date: '',
            title: `僑外生 ${emp.name} 本週排定 ${h.toFixed(1)}h（超過學期中 20h 參考線）`,
            fix: '僅提醒店長留意（寒暑假不限，系統已開放自由排班不強制鎖定）。'
          });
        }
        const otH = Math.max(0, h - 40);
        const empOtPay = Math.round(otH * emp.hourlyRate * 1.34);
        const pay = Math.round(Math.min(40, h) * emp.hourlyRate) + empOtPay;
        totalHours += h; totalCost += pay; otCost += empOtPay;
        summaries[emp.id] = { hours: h, days, pay, hasErr };
      }
      const totalRev = FORECASTS.reduce((a, b) => a + b.revenue, 0);
      return { issues, summaries, totalHours, totalCost, otCost, totalRev, ratio: ((totalCost / totalRev) * 100).toFixed(1) };
    }

    function fmtHour(h) {
      const hh = Math.floor(h);
      const mm = Math.round((h - hh) * 60);
      return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function fmtDurationZh(hours) {
      if (!hours || hours <= 0) return '休假';
      const hh = Math.floor(hours);
      const mm = Math.round((hours - hh) * 60);
      return mm > 0 ? `${hh}h ${mm}m` : `${hh}h`;
    }

    function getShiftSegments(shift) {
      if (!shift) return [];
      const tpl = SHIFT_TEMPLATES[shift.shiftCode];
      if (!tpl || tpl.isOff) return [];
      if (shift.customStart != null && shift.customEnd != null) {
        return [{ start: shift.customStart, end: shift.customEnd, label: `${fmtHour(shift.customStart)}–${fmtHour(shift.customEnd)}` }];
      }
      if (shift.shiftCode === 'SPLIT') {
        return [{ start: 10.5, end: 14.5, label: '10:30–14:30' }, { start: 17.5, end: 21.5, label: '17:30–21:30' }];
      }
      return [{ start: tpl.startHour, end: tpl.endHour, label: `${fmtHour(tpl.startHour)}–${fmtHour(tpl.endHour)}` }];
    }

    function getShiftNetHours(shift) {
      if (!shift) return 0;
      const tpl = SHIFT_TEMPLATES[shift.shiftCode];
      if (!tpl || tpl.isOff) return 0;
      if (shift.customStart != null && shift.customEnd != null) {
        const span = Math.max(0, shift.customEnd - shift.customStart);
        return span >= 6 ? Number((span - 0.5).toFixed(1)) : Number(span.toFixed(1));
      }
      return tpl.netHours;
    }

    function saveShiftBarEdit() {
      const modal = App.sched.editingShiftModal;
      if (!modal) return;
      const emp = App.employees.find(e => e.id === modal.empId);
      const isFlexEnabled = emp && emp.flexHoursType && emp.flexHoursType !== 'STANDARD';
      const code = document.getElementById('bar-edit-code').value;
      const station = document.getElementById('bar-edit-station').value;
      const startVal = document.getElementById('bar-edit-start').value;
      const endVal = document.getElementById('bar-edit-end').value;

      let s = App.sched.shifts.find(x => x.employeeId === modal.empId && x.date === modal.date);
      if (!s) { s = { employeeId: modal.empId, date: modal.date, shiftCode: code, station, aiReason: '手動排班' }; App.sched.shifts.push(s); }
      s.shiftCode = code;
      s.station = station;
      if (isFlexEnabled && !SHIFT_TEMPLATES[code].isOff && code !== 'SPLIT' && startVal && endVal) {
        const [sh, sm] = startVal.split(':').map(Number);
        const [eh, em] = endVal.split(':').map(Number);
        const stH = sh + sm / 60, enH = eh + em / 60;
        const tpl = SHIFT_TEMPLATES[code];
        if (enH > stH && (stH !== tpl.startHour || enH !== tpl.endHour)) { s.customStart = stH; s.customEnd = enH; }
        else { delete s.customStart; delete s.customEnd; }
      } else { delete s.customStart; delete s.customEnd; }

      App.toast = `已更新 ${emp.name} (${modal.date.slice(5)}) 排班時段。`;
      render();
    }

    // Payroll
    function getEmpAttendanceSync(empId, monthKey, att) {
      const monthLogs = App.attendance.logs.filter(l => l.employeeId === empId && l.date.startsWith(monthKey));
      const hasLiveLogs = monthLogs.length > 0;
      const liveLateM = monthLogs.reduce((acc, l) => acc + (Number(l.lateM) || 0), 0);
      const unresolvedMissLogs = monthLogs.filter(l => l.status === 'MISSING_IN' || l.status === 'MISSING_OUT');
      const correctedMissCount = monthLogs.filter(l => l.status === 'CORRECTED').length;
      return { hasLiveLogs, effectiveLateM: hasLiveLogs ? liveLateM : (att.lateM || 0), unresolvedMissCount: unresolvedMissLogs.length, unresolvedMissDates: unresolvedMissLogs.map(l => l.date.slice(5)), correctedMissCount };
    }

    function approveAllPendingMissedFromPayroll() {
      const pending = App.attendance.corrections.filter(c => c.status === 'PENDING');
      if (pending.length === 0) { App.toast = '目前無待審核之漏打卡補卡單。'; render(); return; }
      pending.forEach(req => {
        req.status = 'APPROVED';
        req.managerNote = '薪資結算前批次核准補卡';
        let log = App.attendance.logs.find(l => l.id === req.logId || (l.employeeId === req.employeeId && l.date === req.date));
        if (log) {
          if (req.type === 'MISSING_IN' || req.type === 'BOTH') log.clockIn = req.reqIn;
          if (req.type === 'MISSING_OUT' || req.type === 'BOTH') log.clockOut = req.reqOut;
          log.status = 'CORRECTED'; log.note = '結薪前核准補卡';
        }
      });
      App.toast = `已核准 ${pending.length} 筆補卡單，全店薪資與全勤判定已即時重算。`;

    function calcPayslip(emp, att, monthKey) {
      const mk = monthKey || App.payroll.monthKey;
      const rules = App.payroll.rules;
      const sync = getEmpAttendanceSync(emp.id, mk, att);
      const notes = [];
      const isF = emp.nationalityType === 'FOREIGN';
      const stMeta = FOREIGN_STATUSES.find(s => s.code === emp.foreignStatusType);
      const fixedMonthly = (emp.baseSalary||0) + (emp.meal||0) + (emp.posAllow||0) + (emp.skillAllow||0) + (emp.transportAllow||0) + (emp.splitAllow||0) + (emp.attBonus||0);
      const ordRate = emp.type === 'FT' ? Number((fixedMonthly / 240).toFixed(2)) : emp.hourlyRate;

      let attBonusEarned = 0, attBonusStatus = 'NA', attBonusReason = '計時人員無固定全勤獎金';
      if (emp.type === 'FT' && (emp.attBonus || 0) > 0) {
        if ((att.personalH || 0) > 0) {
          attBonusStatus = 'LOST_LEAVE'; attBonusReason = `當月請事假 ${att.personalH}h，依工作規則取消全勤`;
        } else if (sync.effectiveLateM > rules.lateGraceMinutes) {
          attBonusStatus = 'LOST_LATE'; attBonusReason = `遲到累計 ${sync.effectiveLateM}m（逾寬限 ${rules.lateGraceMinutes}m），取消全勤`;
        } else if (rules.missedPunchDisqualifiesBonus && sync.unresolvedMissCount > 0) {
          attBonusStatus = 'HOLD_MISSED'; attBonusReason = `${sync.unresolvedMissDates.join('、')} 尚有 ${sync.unresolvedMissCount} 筆漏卡未補`;
        } else {
          attBonusEarned = emp.attBonus || 0; attBonusStatus = 'EARNED';
          attBonusReason = sync.correctedMissCount > 0 ? `已完成 ${sync.correctedMissCount} 筆補卡簽核，全額發給` : '出勤正常達標，全額發給';
        }
      }

      const basePay = emp.type === 'FT' ? (emp.baseSalary || 0) : Math.round(att.regH * emp.hourlyRate);
      const fixedAllowOnly = emp.type === 'FT' ? (emp.meal||0) + (emp.posAllow||0) + (emp.skillAllow||0) + (emp.transportAllow||0) + (emp.splitAllow||0) : 0;
      const allowTotal = fixedAllowOnly + attBonusEarned;
      const otPay = Math.ceil(att.ot1 * ordRate * (4/3) + att.ot2 * ordRate * (5/3) + att.rest1 * ordRate * (4/3) + att.rest2 * ordRate * (5/3));
      let holidayPay = 0;
      const hCnt = att.holidaysWorked.length;
      if (emp.type === 'FT' && hCnt > 0) holidayPay = Math.ceil(hCnt * 8 * ordRate);
      else if (emp.type === 'PT' && hCnt > 0) holidayPay = Math.ceil(att.holidayHoursPT * emp.hourlyRate * 2);

      const grossPay = basePay + allowTotal + (att.bonus||0) + otPay + holidayPay;
      const laborB = emp.laborBracket || emp.bracket || 28590;
      const nhiB = emp.nhiBracket || emp.bracket || 28590;
      const laborEmp = Math.round(laborB * 0.125 * 0.20);
      const nhiEmp = Math.round(nhiB * 0.0517 * 0.30 * (1 + (emp.deps||0)));
      const pensionMandatory = !isF || Boolean(stMeta && stMeta.pension6);
      const volPenAmt = pensionMandatory ? Math.round(nhiB * (emp.volPension||0)) : 0;

      const leaveOnlyDeduct = Math.round((att.sickH || 0) * ordRate * 0.5 + (att.personalH || 0) * ordRate);
      const lateDeduct = Math.round((sync.effectiveLateM / 60) * ordRate);
      const missedHoldDeduct = (sync.unresolvedMissCount > 0 && rules.missedPunchHoldHours > 0) ? Math.round(sync.unresolvedMissCount * rules.missedPunchHoldHours * ordRate) : 0;
      const leaveDeduct = leaveOnlyDeduct + lateDeduct + missedHoldDeduct;

      let taxWithhold = 0;
      if (isF && !emp.isTaxResident183Days) {
        const rate = grossPay <= 44250 ? 0.06 : 0.18;
        taxWithhold = Math.round(grossPay * rate);
        notes.push(`外籍非居住者（未滿 183 天）：預扣 ${rate*100}% 所得稅 -NT$${taxWithhold.toLocaleString()}`);
      }
      if (lateDeduct > 0) notes.push(`遲到比例扣款（勞基法§22）：${sync.effectiveLateM}m = -NT$${lateDeduct.toLocaleString()}`);
      if (missedHoldDeduct > 0) notes.push(`漏打卡未補暫扣（${sync.unresolvedMissCount} 筆）：-NT$${missedHoldDeduct.toLocaleString()}，核准補卡後自動補發`);
      if (notes.length === 0) notes.push('完全符合 2026 台灣最低工資、勞基法加班與勞健保規範。');

      const totalDeduct = laborEmp + nhiEmp + volPenAmt + leaveDeduct + taxWithhold;
      const netPay = Math.max(0, grossPay - totalDeduct);
      const employerPen6 = pensionMandatory ? Math.round(nhiB * 0.06) : 0;
      const employerIns = Math.round(laborB * 0.125 * 0.70) + Math.round(nhiB * 0.0517 * 0.60 * 1.56);
      return { emp, att, sync, ordRate, basePay, fixedAllowOnly, attBonusEarned, attBonusStatus, attBonusReason, allowTotal, otPay, holidayPay, grossPay, laborEmp, nhiEmp, volPenAmt, leaveOnlyDeduct, lateDeduct, missedHoldDeduct, leaveDeduct, taxWithhold, totalDeduct, netPay, employerPen6, employerCost: grossPay + employerPen6 + employerIns, pensionMandatory, notes };
    }

    function managerSignOff(reqId, decision) {
      const req = App.liff.requests.find(r => r.id === reqId);
      if (!req || req.status !== 'PENDING') return;
      const noteEl = document.getElementById('mgr-note-' + reqId);
      req.status = decision;
      req.managerNote = (noteEl && noteEl.value.trim()) || (decision === 'APPROVED' ? '已核准，系統已同步排班與假別餘額' : '當日人力不足，請另行協調');
      const emp = App.employees.find(e => e.id === req.employeeId);
      if (decision === 'APPROVED') {
        if (req.kind === 'LEAVE') {
          const bal = ensureLeaveBalance(req.employeeId), h = Number(req.hours) || 8;
          if (req.leaveType === 'ANNUAL') { bal.annualUsed += h; if (emp) emp.annualLeaveH = Math.max(0, bal.annualTotal - bal.annualUsed); }
          else if (req.leaveType === 'SICK') { bal.sickUsed += h; const mAtt = App.payroll.attByMonth['2026-11']?.[req.employeeId]; if (mAtt) mAtt.sickH += h; }
          else if (req.leaveType === 'PERSONAL') { bal.personalUsed += h; const mAtt = App.payroll.attByMonth['2026-11']?.[req.employeeId]; if (mAtt) mAtt.personalH += h; }
          else if (req.leaveType === 'FAMILY_CARE') { bal.familyCareUsed = (bal.familyCareUsed || 0) + h; bal.personalUsed += h; }
          else if (req.leaveType === 'COMP_OFF') bal.compOffRemain = Math.max(0, bal.compOffRemain - h);
          else if (req.leaveType === 'MENSTRUAL') bal.menstrualUsedMonth += 1;
          const s = App.sched.shifts.find(x => x.employeeId === req.employeeId && x.date === req.date);
          if (s) { s.shiftCode = 'OFF_REST'; delete s.customStart; delete s.customEnd; }
          App.toast = `已核准 ${emp.name} 請假，假別餘額與排班時間軸已同步更新。`;
        } else if (req.kind === 'SWAP') {
          const s1 = App.sched.shifts.find(x => x.employeeId === req.employeeId && x.date === req.date);
          const s2 = App.sched.shifts.find(x => x.employeeId === req.deputyId && x.date === req.date);
          if (s1 && s2) {
            [s1.shiftCode, s2.shiftCode] = [s2.shiftCode, s1.shiftCode];
            [s1.station, s2.station] = [s2.station, s1.station];
            [s1.customStart, s2.customStart] = [s2.customStart, s1.customStart];
            [s1.customEnd, s2.customEnd] = [s2.customEnd, s1.customEnd];
          }
          App.toast = `已核准調班，${req.date.slice(5)} 排班時間條已即時互換。`;
        }
      } else { App.toast = `已駁回 ${emp.name} 之申請。`; }
      render();
    }

      if (!inStr || !outStr) return '— (漏卡)';
      const [ih, im] = inStr.split(':').map(Number), [oh, om] = outStr.split(':').map(Number);
      const mins = (oh * 60 + om) - (ih * 60 + im);
      return mins <= 0 ? '—' : `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2,'0')}m`;
    }

    function doLiveClockPunch(kind) {

      const today = '2026-11-21';
      let existing = App.attendance.logs.find(l => l.employeeId === emp.id && l.date === today);
      if (!existing) {
        App.attendance.logs.unshift({
          id: 'log-' + Date.now(), employeeId: emp.id, date: today, scheduled: '08:30–17:00',
          clockIn: kind === 'IN' ? hhmm : '', clockOut: kind === 'OUT' ? hhmm : '',

        });
      } else {
        if (kind === 'IN') existing.clockIn = hhmm;
        if (kind === 'OUT') existing.clockOut = hhmm;

      }
      App.toast = `${emp.name} 已於 ${hhmm} 完成${kind === 'IN' ? '上班打卡' : '下班簽退'}（GPS 12m 驗證通過）。`;

    function reviewMissedPunch(mpId, decision) {
      const req = App.attendance.corrections.find(c => c.id === mpId);
      if (!req || req.status !== 'PENDING') return;
      const noteEl = document.getElementById('mp-note-' + mpId);
      req.status = decision;
      req.managerNote = (noteEl && noteEl.value.trim()) || (decision === 'APPROVED' ? '核對無誤，准予補登' : '時間與紀錄不符');
      const emp = App.employees.find(e => e.id === req.employeeId);
      if (decision === 'APPROVED') {
        let log = App.attendance.logs.find(l => l.id === req.logId || (l.employeeId === req.employeeId && l.date === req.date));

      });
      const csv = '\uFEFF' + [headers, ...rows].map(r => r.join(',')).join('\n');

      const ev = evalSchedule();

      const dayStats = {};
      FORECASTS.forEach(f => {
        const isClosed = (App.sched.dayConfig[f.date] || {}).isClosed;
        const working = isClosed ? [] : App.employees.filter(e => {
          const s = App.sched.shifts.find(x => x.employeeId === e.id && x.date === f.date);
          return s && !SHIFT_TEMPLATES[s.shiftCode].isOff;
        });
        const dayHours = working.reduce((acc, e) => acc + getShiftNetHours(App.sched.shifts.find(x => x.employeeId === e.id && x.date === f.date)), 0);
        dayStats[f.date] = { count: working.length, hours: dayHours, isClosed };
      });
      const curDayStat = dayStats[selDate];

      const AXIS_START = 8, AXIS_END = 23, AXIS_SPAN = 15;
      const AXIS_TICKS = [8, 10, 12, 14, 16, 18, 20, 22];
      // 餐期尖峰標記 (11:30-14:00, 17:30-20:30)
      const peakZones = [
        { left: ((11.5 - AXIS_START) / AXIS_SPAN) * 100, width: (2.5 / AXIS_SPAN) * 100, label: '午尖峰' },
        { left: ((17.5 - AXIS_START) / AXIS_SPAN) * 100, width: (3.0 / AXIS_SPAN) * 100, label: '晚尖峰' },
      ];

      const dayRows = App.employees.map(emp => {
        const shift = App.sched.shifts.find(x => x.employeeId === emp.id && x.date === selDate);

        const hours = dayCfg.isClosed ? 0 : getShiftNetHours(shift);
        return { emp, shift, segments, hours, isWorking: segments.length > 0 };
      }).filter(row => App.sched.showOffStaff ? true : row.isWorking);

      const slotHeadcounts = AXIS_TICKS.map(tick => {
        const mid = tick + 1;
        return { tick, count: dayRows.filter(r => r.segments.some(seg => seg.start <= mid && seg.end > mid)).length };
      });

      return `
        <div class="space-y-4">

      const mk = App.payroll.monthKey, rules = App.payroll.rules, attMap = App.payroll.attByMonth[mk];
      const slips = App.employees.map(e => calcPayslip(e, attMap[e.id] || { regH: 100, ot1: 0, ot2: 0, rest1: 0, rest2: 0, holidaysWorked: [], holidayHoursPT: 0, sickH: 0, personalH: 0, lateM: 0, bonus: 0 }, mk));

      const totNet = slips.reduce((a, b) => a + b.netPay, 0);
      const totHol = slips.reduce((a, b) => a + b.holidayPay, 0);
      const totAttDeduct = slips.reduce((a, b) => a + b.lateDeduct + b.missedHoldDeduct, 0);
      const totEmpCost = slips.reduce((a, b) => a + b.employerCost, 0);
      const pendingMissedReqs = App.attendance.corrections.filter(c => c.status === 'PENDING').length;

    function signPayrollPayslip(mk, empId) {
      const emp = App.employees.find(e => e.id === empId);
      const now = new Date();
      const ts = `2026-11-21 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      App.payroll.dispatched[mk + '_' + empId] = true;
      App.payroll.signed[mk + '_' + empId] = ts;
      App.toast = `${emp ? emp.name : ''} 已透過 LINE LIFF 完成 ${mk} 電子薪資條確認簽回（${ts}）。`;
      render();
    }

    function renderAttendanceModule() {
      const a = App.attendance;
      const filteredLogs = a.logs.filter(l => {
        if (a.filterEmp !== 'ALL' && l.employeeId !== a.filterEmp) return false;
        if (a.searchDate && l.date !== a.searchDate) return false;
        if (a.filterStatus === 'ANOMALY') return l.status === 'MISSING_IN' || l.status === 'MISSING_OUT' || l.status === 'LATE';
        if (a.filterStatus !== 'ALL') return l.status === a.filterStatus;
        return true;
      });
      const pendingMpCnt = a.corrections.filter(c => c.status === 'PENDING').length;

                          <button onclick="reviewMissedPunch('${c.id}','APPROVED')" class="h-8 px-4 rounded-lg bg-[#0F766E] text-white font-semibold cursor-pointer">核准補卡</button>

            </div>
            <div class="overflow-x-auto">

                      <tr class="border-b border-slate-100 last:border-b-0 ${isMiss ? 'bg-rose-50/40' : 'hover:bg-slate-50'}">

                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 模組 6：店鋪與權限設定 (4 個乾淨子分頁，取代無盡垂直堆疊)

                          const isMiss = l.status === 'MISSING_IN' || l.status === 'MISSING_OUT';
                          return `
                            <div class="p-2.5 rounded-lg border ${isMiss ? 'border-rose-200 bg-rose-50/40' : 'border-slate-100 bg-slate-50/60'} space-y-1">
                              <div class="flex items-center justify-between">
                                <span class="mono-num font-bold text-slate-800">${l.date}</span>
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${l.status==='NORMAL'?'bg-emerald-50 text-emerald-700':l.status==='CORRECTED'?'bg-teal-50 text-teal-700':l.status==='LATE'?'bg-amber-50 text-amber-700':'bg-rose-50 text-rose-700'}">
                                  ${l.status==='NORMAL'?'正常':l.status==='CORRECTED'?'已補卡':l.status==='LATE'?`遲到 ${l.lateM}m`:'漏打卡'}
                                </span>
                              </div>
                              <div class="flex items-center justify-between text-[11px] text-slate-500 mono-num">
                                <span>班表 ${l.scheduled}</span>
                                <span>${calcWorkedLabel(l.clockIn, l.clockOut)}</span>
                              </div>
                              <div class="flex items-center justify-between text-[11px] mono-num pt-0.5">
                                <span>打卡 <strong class="${!l.clockIn?'text-rose-600':'text-slate-800'}">${l.clockIn || '未打'}</strong> – <strong class="${!l.clockOut?'text-rose-600':'text-slate-800'}">${l.clockOut || '未打'}</strong></span>
                                ${isMiss ? `<button onclick="prefillMissedPunch('${l.employeeId}','${l.date}','${l.status}','${l.clockIn}','${l.clockOut}')" class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-bold cursor-pointer">補卡</button>` : ''}
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  ` : `
                    <form onsubmit="submitMissedPunch(event)" class="bg-white rounded-xl p-3.5 border border-slate-200 space-y-2.5">
                      <div class="font-bold text-slate-900">漏打卡補登申請</div>
                      <input type="date" value="${App.attendance.draft.date}" onchange="App.attendance.draft.date=this.value" class="w-full h-8 px-2 rounded border border-slate-200 mono-num" />
                      <div class="grid grid-cols-2 gap-2"><input type="time" value="${App.attendance.draft.reqIn}" onchange="App.attendance.draft.reqIn=this.value" class="h-8 px-2 rounded border border-slate-200 mono-num" /><input type="time" value="${App.attendance.draft.reqOut}" onchange="App.attendance.draft.reqOut=this.value" class="h-8 px-2 rounded border border-slate-200 mono-num" /></div>
                      <input value="${App.attendance.draft.reason}" oninput="App.attendance.draft.reason=this.value" placeholder="補卡原因說明" class="w-full h-8 px-2.5 rounded border border-slate-200" />
                      <button type="submit" class="w-full h-9 rounded-lg bg-[#06C755] text-white font-bold cursor-pointer">送出補卡申請</button>
                    </form>
                  `}
                `;
              })() : ''}
            </div>
          </aside>
        </div>
      `;
    }


    // 自動儲存操作資料至瀏覽器本機 (重新整理不遺失)
    const STORAGE_KEY = 'shiftcraft_ai_state_v1';
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.employees && parsed.sched && parsed.storeSettings) {
          App.employees = parsed.employees;
          App.sched.shifts = parsed.sched.shifts || App.sched.shifts;
          App.sched.dayConfig = parsed.sched.dayConfig || App.sched.dayConfig;
          App.payroll.rules = parsed.payroll?.rules || App.payroll.rules;
          App.liff.requests = parsed.liff?.requests || App.liff.requests;
          App.liff.balances = parsed.liff?.balances || App.liff.balances;
          App.attendance.logs = parsed.attendance?.logs || App.attendance.logs;
          App.attendance.corrections = parsed.attendance?.corrections || App.attendance.corrections;
          App.storeSettings = { ...App.storeSettings, ...parsed.storeSettings };
          if (typeof syncStationsCatalog === 'function') syncStationsCatalog();
        }
      }
    } catch (e) {}

    const _origRender = render;
    render = function() {
      _origRender();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          employees: App.employees,
          sched: { shifts: App.sched.shifts, dayConfig: App.sched.dayConfig },
          payroll: { rules: App.payroll.rules },
          liff: { requests: App.liff.requests, balances: App.liff.balances },
          attendance: { logs: App.attendance.logs, corrections: App.attendance.corrections },
          storeSettings: App.storeSettings,
        }));
      } catch (e) {}
    };

    render();
  </script>
</body>
</html>
