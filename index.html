    function getNextEmployeeCode(empType) {
      const defaultPrefix = empType === 'PT' ? 'PT-' : 'FT-';
      const allEmps = [];
      try {
        if (App) {
          if (Array.isArray(App.employees)) allEmps.push(...App.employees);
          if (App.multiStore && App.multiStore.storeData) {
            Object.entries(App.multiStore.storeData).forEach(([sid, snap]) => {
              if (sid === App.multiStore.activeStoreId) return;
              if (snap && Array.isArray(snap.employees)) allEmps.push(...snap.employees);
            });
          }
        }
      } catch (e) {}

      // 優先找「同身分別(FT/PT)」最後建檔的員工，沒有則找全店最後一位有數字結尾的員工
      const sameType = allEmps.filter(e => e && e.code && (!empType || e.type === empType));
      const candidates = sameType.length > 0 ? sameType : allEmps.filter(e => e && e.code);
      let baseMatch = null;
      for (let i = candidates.length - 1; i >= 0; i--) {
        const m = String(candidates[i].code).trim().match(/^(.*?)(\d+)$/);
        if (m) { baseMatch = m; break; }
      }

      if (!baseMatch) {
        return '';
      }

      const prefix = baseMatch[1];
      const digitWidth = baseMatch[2].length;
      let maxNum = parseInt(baseMatch[2], 10) || 0;

      // 掃描所有相同前綴的員工，確保取最大值 + 1 不撞號
      allEmps.forEach(e => {
        if (!e || !e.code) return;
        const m = String(e.code).trim().match(/^(.*?)(\d+)$/);
        if (m && m[1].toLowerCase() === prefix.toLowerCase()) {
          const n = parseInt(m[2], 10);
          if (!isNaN(n) && n > maxNum) maxNum = n;
        }
      });

      return `${prefix}${String(maxNum + 1).padStart(digitWidth, '0')}`;
    }

    function evaluatePasswordStrength(password, email) {
      const pw = String(password || '');
      const lower = pw.toLowerCase();
      const emailPrefix = String(email || '').trim().toLowerCase().split('@')[0] || '';
      const hasLen = pw.length >= 10;
      const hasUpper = /[A-Z]/.test(pw);
      const hasLower = /[a-z]/.test(pw);
      const hasDigit = /\d/.test(pw);
      const hasSymbol = /[^A-Za-z0-9]/.test(pw);
      const isCommon = COMMON_WEAK_PASSWORDS.has(lower) || (emailPrefix.length >= 4 && lower.includes(emailPrefix));
      const errors = [];
      if (!hasLen) errors.push('長度至少需 10 碼');
      if (!hasUpper) errors.push('須包含英文大寫 (A–Z)');
      if (!hasLower) errors.push('須包含英文小寫 (a–z)');
      if (!hasDigit) errors.push('須包含數字 (0–9)');
      if (isCommon) errors.push('不可使用常見弱密碼或帳號名稱');
      let score = 0;
      if (hasLen) score++;
      if (hasUpper && hasLower) score++;
      if (hasDigit) score++;
      if (hasSymbol || pw.length >= 14) score++;
      if (isCommon) score = Math.min(score, 1);
      const ok = hasLen && hasUpper && hasLower && hasDigit && !isCommon;
      const label = score >= 4 ? '高強度' : score === 3 ? '良好' : score === 2 ? '尚可' : '過弱';
      const barCls = score >= 4 ? 'bg-emerald-600' : score === 3 ? 'bg-teal-600' : score === 2 ? 'bg-amber-500' : 'bg-rose-500';
      const textCls = score >= 4 ? 'text-emerald-700' : score === 3 ? 'text-teal-700' : score === 2 ? 'text-amber-700' : 'text-rose-600';
      return { ok, score, label, barCls, textCls, errors, checks: { hasLen, hasUpper, hasLower, hasDigit, hasSymbol, notCommon: !isCommon } };
    }

    function renderPasswordStrengthBarHtml(password, email) {
      if (!password) return `<div class="text-[10px] text-slate-400">安全要求：至少 10 碼，並同時包含英文大寫、英文小寫與數字</div>`;
      const st = evaluatePasswordStrength(password, email);
      const pill = (ok, txt) => `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${ok ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${ok ? '✓' : '○'} ${txt}</span>`;
      return `
        <div class="space-y-1.5 pt-1">
          <div class="flex items-center gap-2">
            <div class="flex-1 grid grid-cols-4 gap-1 h-1.5">

            </div>
            <span class="text-[10px] font-bold ${st.textCls}">強度：${st.label}</span>
          </div>

            ${pill(st.checks.hasLen, '10 碼以上')}
            ${pill(st.checks.hasUpper, '英文大寫')}

            ${pill(st.checks.hasDigit, '數字')}
            ${pill(st.checks.notCommon, '非弱密碼')}
          </div>
        </div>
      `;
    }

    function _bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function _hexToBytes(hex) {
      const out = new Uint8Array(Math.floor(hex.length / 2));
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16) || 0;
      return out;
    }

    async function hashAccountPasswordLegacy(email, password) {
      const normalized = `shiftcraft-v1:${String(email || '').trim().toLowerCase()}:${String(password || '')}`;
      if (window.crypto && window.crypto.subtle) {
        const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(normalized));
        return _bytesToHex(new Uint8Array(buf));
      }
      let h = 2166136261;
      for (let i = 0; i < normalized.length; i++) {
        h ^= normalized.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return 'fb-' + (h >>> 0).toString(16);
    }

    async function hashAccountPassword(email, password, customSaltHex, customIterations) {
      const iterations = customIterations || 100000;
      if (window.crypto && window.crypto.subtle && typeof window.crypto.subtle.importKey === 'function') {
        const saltBytes = customSaltHex
          ? _hexToBytes(customSaltHex)
          : window.crypto.getRandomValues(new Uint8Array(16));
        const saltHex = customSaltHex || _bytesToHex(saltBytes);
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(String(password || '')),
          { name: 'PBKDF2' },
          false,
          ['deriveBits']
        );
        const derived = await window.crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' },
          keyMaterial,
          256
        );
        return `pbkdf2$${iterations}$${saltHex}$${_bytesToHex(new Uint8Array(derived))}`;
      }
      return hashAccountPasswordLegacy(email, password);
    }

    async function verifyAccountPassword(email, password, storedHash) {
      const stored = String(storedHash || '');
      if (stored.startsWith('pbkdf2$')) {
        const parts = stored.split('$');
        if (parts.length !== 4) return { valid: false, needsUpgrade: false };
        const iter = Math.max(10000, Number(parts[1]) || 100000);
        const saltHex = parts[2];
        const computed = await hashAccountPassword(email, password, saltHex, iter);
        return { valid: computed === stored, needsUpgrade: false };
      }
      const legacy = await hashAccountPasswordLegacy(email, password);
      return { valid: legacy === stored, needsUpgrade: true };
    }

    function _readLoginGuardMap() {
      try { return JSON.parse(localStorage.getItem(LOGIN_GUARD_KEY) || '{}') || {}; } catch (e) { return {}; }
    }
    function _writeLoginGuardMap(map) {
      try { localStorage.setItem(LOGIN_GUARD_KEY, JSON.stringify(map)); } catch (e) {}
    }
    function getLoginLockoutInfo(email) {
      const key = String(email || '').trim().toLowerCase();
      if (!key) return { locked: false, remainMins: 0, failCount: 0 };
      const rec = _readLoginGuardMap()[key];
      if (!rec) return { locked: false, remainMins: 0, failCount: 0 };
      const now = Date.now();
      if (rec.lockedUntil && rec.lockedUntil > now) {
        return { locked: true, remainMins: Math.max(1, Math.ceil((rec.lockedUntil - now) / 60000)), failCount: rec.failCount || 5 };
      }
      return { locked: false, remainMins: 0, failCount: rec.failCount || 0 };
    }
    function recordLoginFailure(email) {
      const key = String(email || '').trim().toLowerCase();
      if (!key) return { locked: false, remainMins: 0, failCount: 1 };
      const map = _readLoginGuardMap();
      const prev = map[key] || { failCount: 0, lockedUntil: 0 };
      const failCount = (prev.lockedUntil && prev.lockedUntil <= Date.now()) ? 1 : (prev.failCount || 0) + 1;
      const lockedUntil = failCount >= 5 ? (Date.now() + 15 * 60 * 1000) : 0;
      map[key] = { failCount, lockedUntil };
      _writeLoginGuardMap(map);
      return { locked: lockedUntil > 0, remainMins: lockedUntil > 0 ? 15 : 0, failCount };
    }
    function clearLoginFailures(email) {
      const key = String(email || '').trim().toLowerCase();
      if (!key) return;
      const map = _readLoginGuardMap();
      if (map[key]) { delete map[key]; _writeLoginGuardMap(map); }
    }

      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;

    async function refreshAccountSubscription(showToast) {
      if (!App.auth.loggedIn || App.auth.isDemo || !App.auth.email) return;
      const sb = getAccountSupabaseClient();
      if (!sb) return;
      try {
        const { data, error } = await sb
          .from('shiftcraft_accounts')
          .select('*')
          .eq('email', App.auth.email.trim().toLowerCase())
          .maybeSingle();
        if (error) throw error;
        if (data) {
          applyAccountRecord(data);
          if (showToast) {
            const ent = getAccountEntitlement();
            App.toast = ent.isExpired
              ? `已更新帳號狀態：目前方案已於 ${ent.expiresDateStr} 到期，請續約開通。`
              : `已更新帳號狀態：${ent.planName}（${ent.subStatus === 'ACTIVE' ? '正式訂閱中' : '免費試用中'}，到期日 ${ent.expiresDateStr}，剩餘 ${ent.daysLeft} 天）`;
          }
          render();
        }
      } catch (err) {
        if (showToast) {
          App.toast = '無法讀取最新訂閱狀態，請稍後再試。';

    async function submitAuthForm(e) {
      e.preventDefault();
      if (App.auth.authBusy) return;
      const d = App.auth.loginDraft;
      const email = (d.email || '').trim().toLowerCase();
      const password = String(d.password || '');
      const isRegister = App.auth.authMode === 'REGISTER';

      if (!email || !email.includes('@')) {
        App.auth.authError = '請輸入正確的 Email 帳號。';
        render();
        return;
      }
      if (isRegister) {
        const pwCheck = evaluatePasswordStrength(password, email);
        if (!pwCheck.ok) {
          App.auth.authError = '密碼強度不足：' + pwCheck.errors.join('、') + '。';
          render();
          return;
        }
        if (password !== String(d.confirmPassword || '')) {
          App.auth.authError = '兩次輸入的密碼不一致，請重新確認。';
          render();
          return;
        }
        if (!(d.companyName || '').trim()) {
          App.auth.authError = '請輸入餐飲品牌或門市名稱。';
          render();
          return;
        }
      } else {
        if (!password) {
          App.auth.authError = '請輸入登入密碼。';
          render();
          return;
        }
        const lock = getLoginLockoutInfo(email);
        if (lock.locked) {
          App.auth.authError = `此帳號連續密碼錯誤達 5 次，為防止暴力破解已暫時鎖定，請於 ${lock.remainMins} 分鐘後再試。`;
          render();
          return;
        }
      }

      const sb = getAccountSupabaseClient();
      if (!sb) {
        App.auth.authError = '目前無法連線雲端帳號服務，請檢查網路後重試。';
        render();
        return;
      }

      App.auth.authBusy = true;
      App.auth.authError = '';
      render();

      try {
        if (isRegister) {
          const pwHash = await hashAccountPassword(email, password);
          const { data: existing, error: checkErr } = await sb
            .from('shiftcraft_accounts')
            .select('email')
            .eq('email', email)
            .maybeSingle();
          if (checkErr) throw checkErr;
          if (existing) {
            App.auth.authBusy = false;
            App.auth.authError = '這個 Email 已經註冊過了，請切到「業者帳號登入」直接登入。';
            render();
            return;
          }

          const brandName = d.companyName.trim();
          const storeCnt = Math.max(1, Math.min(50, Number(d.storeCount) || 1));
          const newBrandId = 'brand-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
          const trialEndsAt = new Date(Date.now() + 14 * 86400000).toISOString();

          const newAcc = {
            email,
            password_hash: pwHash,
            brand_id: newBrandId,
            company_name: brandName,
            plan_code: 'PRO',
            sub_status: 'TRIAL',
            billing_cycle: 'MONTHLY',
            max_stores: storeCnt,
            trial_ends_at: trialEndsAt,
            paid_until: null,
            note: '官網自助註冊 14 天試用',
            last_login_at: new Date().toISOString(),
          };

          const { error: insErr } = await sb.from('shiftcraft_accounts').insert(newAcc);
          if (insErr) throw insErr;

          resetWorkspaceForNewBrand(brandName, storeCnt, email);

          applyAccountRecord(newAcc);
          App.auth.weakPasswordWarning = false;
          App.mainTab = 'HR';
          App.auth.authBusy = false;
          App.auth.loginDraft = { email: '', password: '', confirmPassword: '', companyName: '', storeCount: 1 };
          App.toast = `🎉 歡迎加入班匠！「${brandName}」全新空白門市空間已建立，14 天免費試用啟動（到期日 ${formatIsoDateTW(trialEndsAt)}），請先新增您的第一位員工！`;
          render();
          await initCloudSync(false);
          for (const stMeta of App.multiStore.stores) {
            await pushStoreToCloud(stMeta.id);
          }
        } else {
          // LOGIN
          const { data: acc, error: selErr } = await sb
            .from('shiftcraft_accounts')
            .select('*')
            .eq('email', email)
            .maybeSingle();
          if (selErr) throw selErr;
          if (!acc) {
            App.auth.authBusy = false;
            App.auth.authError = '找不到這個 Email 帳號，請確認信箱或先點「免費試用 14 天」註冊。';
            render();
            return;
          }
          const verifyRes = await verifyAccountPassword(email, password, acc.password_hash);
          if (!verifyRes.valid) {
            const failInfo = recordLoginFailure(email);
            App.auth.authBusy = false;
            App.auth.authError = failInfo.locked
              ? `密碼連續錯誤 5 次，為防止暴力破解已鎖定 ${failInfo.remainMins} 分鐘。`
              : `密碼不正確，請重新輸入（剩餘 ${Math.max(0, 5 - failInfo.failCount)} 次機會）。`;
            render();
            return;
          }

          clearLoginFailures(email);
          _lastUserActivityAt = Date.now();
          const updatePayload = { last_login_at: new Date().toISOString() };
          if (verifyRes.needsUpgrade) {
            // 無痛自動升級為 PBKDF2 10 萬次加鹽雜湊
            updatePayload.password_hash = await hashAccountPassword(email, password);
          }
          await sb
            .from('shiftcraft_accounts')
            .update(updatePayload)
            .eq('email', email);
          App.auth.weakPasswordWarning = !evaluatePasswordStrength(password, email).ok;

          applyAccountRecord(acc);
          App.auth.authBusy = false;
          App.auth.loginDraft = { email: '', password: '', companyName: '', storeCount: 1 };
          const ent = getAccountEntitlement();
          App.toast = ent.isExpired
            ? `歡迎回來「${App.auth.companyName}」！您的方案已於 ${ent.expiresDateStr} 到期，資料皆已安全保留，請選擇方案續用。`
            : `歡迎回來「${App.auth.companyName}」！目前為 ${ent.planName}（剩餘 ${ent.daysLeft} 天）。`;
          render();
          await initCloudSync(false);
        }
      } catch (err) {
        App.auth.authBusy = false;
        const msg = (err && err.message) ? err.message : String(err);
        if (msg.includes('shiftcraft_accounts') || msg.includes('does not exist') || msg.includes('42P01')) {
          App.auth.authError = '雲端帳號資料表尚未建立，請管理員先在 Supabase 執行建表腳本。';
        } else {
          App.auth.authError = '連線發生錯誤：' + msg;
        }
        render();
      }
    }

    function syncBoundLineEmployee() {
      const prof = App.lineLiff && App.lineLiff.profile;
      if (!prof || !prof.userId) return null;
      const matched = App.employees.find(e => e.lineUserId === prof.userId && !isEmployeeResigned(e));
      if (matched) {
        App.attendance.liffEmpId = matched.id;
        App.liff.empId = matched.id;
        App.payroll.liffEmpId = matched.id;
        App.payroll.selectedEmpId = matched.id;
        App.sched.liffEmpId = matched.id;
      }
      return matched || null;
    }

    function bindLineUserToEmployee(empId) {
      const prof = App.lineLiff && App.lineLiff.profile;
      if (!prof || !prof.userId) return;
      const target = App.employees.find(e => e.id === empId && !isEmployeeResigned(e));
      if (!target) return;
      // 清除同一 LINE 帳號原本在其他員工上的舊綁定
      App.employees.forEach(e => {
        if (e.lineUserId === prof.userId) {
          delete e.lineUserId;
          delete e.lineDisplayName;
          delete e.linePictureUrl;
        }
      });
      target.lineUserId = prof.userId;
      target.lineDisplayName = prof.displayName || '';
      target.linePictureUrl = prof.pictureUrl || '';
      syncBoundLineEmployee();
      App.toast = `✅ 已將您的 LINE 綁定為「${target.name}」，下次打開將自動載入您的個人班表與薪資！`;
      render();
      pushStoreToCloud(App.multiStore.activeStoreId);
    }

    function unbindLineUser() {
      const prof = App.lineLiff && App.lineLiff.profile;
      if (!prof || !prof.userId) return;
      App.employees.forEach(e => {
        if (e.lineUserId === prof.userId) {
          delete e.lineUserId;
          delete e.lineDisplayName;
          delete e.linePictureUrl;
        }
      });
      App.liffRole = 'STAFF';
      App.toast = '已解除 LINE 員工綁定，請重新選擇您的姓名。';
      render();
      pushStoreToCloud(App.multiStore.activeStoreId);
    }

    function unbindEmployeeLineByManager(empId) {
      const emp = App.employees.find(e => e.id === empId);
      if (!emp || !emp.lineUserId) return;
      if (!confirm(`確定要解除「${emp.name}（${emp.code}）」的 LINE 綁定嗎？解除後該員工下次從 LINE 開啟即可重新選擇身分。`)) return;
      delete emp.lineUserId;
      delete emp.lineDisplayName;
      delete emp.linePictureUrl;
      if (App.hr.editingId === empId && App.hr.form) {
        delete App.hr.form.lineUserId;
        delete App.hr.form.lineDisplayName;
        delete App.hr.form.linePictureUrl;
      }
      App.toast = `已解除「${emp.name}」的 LINE 綁定，該員工可重新於 LINE 選擇身分。`;
      render();
      pushStoreToCloud(App.multiStore.activeStoreId);
    }

    const SENSITIVE_EMP_FIELDS = [
      'nationalId', 'birthDate', 'accountNumber', 'phone', 'registeredAddress', 'mailingAddress',
      'passportNumber', 'emergencyPhone', 'idFrontImg', 'idBackImg', 'workPermitImg', 'bankBookImg',
    ];
    const _brandCryptoKeyCache = {};

    function canAccessSensitivePii() {
      const r = App.storeSettings && App.storeSettings.activeRole;
      return r === 'OWNER' || r === 'HR';
    }

    function maskSensitiveText(val, keepTail = 3) {
      const s = String(val || '').trim();
      if (!s) return '—';
      if (s.length <= keepTail + 2) return '••••••';
      return s.slice(0, 2) + '••••' + s.slice(-keepTail);
    }

    function _bytesToBase64(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function _base64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function getBrandCryptoKey(brandId) {
      if (!window.crypto || !window.crypto.subtle) return null;
      const keyId = String(brandId || 'brand-default');
      if (_brandCryptoKeyCache[keyId]) return _brandCryptoKeyCache[keyId];
      const rawHash = await window.crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(`shiftcraft-pii-aes256-v1:${keyId}`)
      );
      const key = await window.crypto.subtle.importKey('raw', rawHash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
      _brandCryptoKeyCache[keyId] = key;
      return key;
    }

    async function encryptPiiValue(val, key) {
      if (!key || typeof val !== 'string' || !val || val.startsWith('ENC_GCM_V1:')) return val;
      try {
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encBuf = await window.crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          new TextEncoder().encode(val)
        );
        return 'ENC_GCM_V1:' + _bytesToBase64(iv) + ':' + _bytesToBase64(new Uint8Array(encBuf));
      } catch (e) {
        return val;
      }
    }

    async function decryptPiiValue(val, key) {
      if (!key || typeof val !== 'string' || !val.startsWith('ENC_GCM_V1:')) return val;
      try {
        const parts = val.split(':');
        if (parts.length !== 3) return val;
        const iv = _base64ToBytes(parts[1]);
        const ct = _base64ToBytes(parts[2]);
        const decBuf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
        return new TextDecoder().decode(decBuf);
      } catch (e) {
        return val;
      }
    }

    async function encryptStorePayload(payload, brandId) {
      if (!payload || !Array.isArray(payload.employees)) return payload;
      const key = await getBrandCryptoKey(brandId);
      if (!key) return payload;
      const cloned = JSON.parse(JSON.stringify(payload));
      for (const emp of cloned.employees) {
        if (!emp) continue;
        for (const field of SENSITIVE_EMP_FIELDS) {
          if (emp[field]) emp[field] = await encryptPiiValue(String(emp[field]), key);
        }
      }
      return cloned;
    }

    async function decryptStorePayload(payload, brandId) {
      if (!payload || !Array.isArray(payload.employees)) return payload;
      const key = await getBrandCryptoKey(brandId);
      if (!key) return payload;
      const cloned = JSON.parse(JSON.stringify(payload));
      for (const emp of cloned.employees) {
        if (!emp) continue;
        for (const field of SENSITIVE_EMP_FIELDS) {
          if (emp[field]) emp[field] = await decryptPiiValue(String(emp[field]), key);
        }
      }
      return cloned;
    }

    async function pushStoreToCloud(storeId) {
      if (!_sbClient || (App.cloud.status !== 'SYNCED' && App.cloud.status !== 'SYNCING')) return;
      const ms = App.multiStore;
      const sid = storeId || ms.activeStoreId;
      const meta = ms.stores.find(s => s.id === sid) || { id: sid, name: App.storeSettings.name, city: '' };
      const payload = sid === ms.activeStoreId ? captureActiveStoreSnapshot() : (ms.storeData[sid] || createBlankStoreSnapshot(meta));
      ms.storeData[sid] = payload;
      try {
        App.cloud.status = 'SYNCING';
        const encryptedPayload = await encryptStorePayload(payload, ms.brandId);
        const { error } = await _sbClient.from('shiftcraft_stores').upsert({
          brand_id: ms.brandId,
          store_id: sid,
          store_name: meta.name,
          city: meta.city || '',
          payload: encryptedPayload,
          updated_by: CLOUD_CLIENT_ID,
          updated_at: new Date().toISOString(),
        }, { onConflict: 'brand_id,store_id' });
        if (error) throw error;
        App.cloud.status = 'SYNCED';
        App.cloud.error = null;
        App.cloud.lastSyncedAt = new Date().toLocaleTimeString('zh-TW', { hour12: false });
      } catch (err) {
        App.cloud.status = 'ERROR';
        App.cloud.error = err && err.message ? err.message : String(err);
      }
    }

    function scheduleCloudPush() {
      if (_suppressCloudPush || !_sbClient) return;
      if (App.cloud.status !== 'SYNCED' && App.cloud.status !== 'SYNCING') return;
      if (_cloudPushTimer) clearTimeout(_cloudPushTimer);
      _cloudPushTimer = setTimeout(() => {
        pushStoreToCloud(App.multiStore.activeStoreId);
      }, 650);
    }

    async function initCloudSync(showToast) {
      let cfg = null;
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) cfg = JSON.parse(raw);
      } catch (e) {}
      if (!cfg && DEFAULT_CLOUD_CONFIG.url && DEFAULT_CLOUD_CONFIG.anonKey) {
        cfg = DEFAULT_CLOUD_CONFIG;
      }
      if (!cfg || !cfg.url || !cfg.anonKey || typeof window.supabase === 'undefined') {
        App.cloud.status = 'LOCAL';
        return;
      }

      App.cloud.url = cfg.url;
      App.cloud.anonKey = cfg.anonKey;
      const urlParams = new URLSearchParams(window.location.search);
      const urlBrand = urlParams.get('brand');
      const urlStore = urlParams.get('store');
      if (urlBrand) {
        App.multiStore.brandId = urlBrand;
        try {
          localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({
            url: cfg.url,
            anonKey: cfg.anonKey,
            brandId: urlBrand,
            storeId: urlStore || (cfg && cfg.storeId) || '',
          }));
        } catch (e) {}
      } else if (cfg.brandId) {
        App.multiStore.brandId = cfg.brandId;
      }
      App.cloud.status = 'CONNECTING';
      App.cloud.error = null;

      try {
        if (_sbChannel && _sbClient) {
          try { _sbClient.removeChannel(_sbChannel); } catch (e) {}
        }
        _sbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
        const { data, error } = await _sbClient
          .from('shiftcraft_stores')
          .select('*')
          .eq('brand_id', App.multiStore.brandId)
          .order('store_id', { ascending: true });
        if (error) throw error;

        if (data && data.length > 0) {
          App.multiStore.stores = data.map(r => ({ id: r.store_id, name: r.store_name, city: r.city || '' }));
          App.multiStore.storeData = {};
          for (const r of data) {
            App.multiStore.storeData[r.store_id] = await decryptStorePayload(r.payload, App.multiStore.brandId);
          }
          const savedStore = urlStore || (cfg && cfg.storeId) || '';
          const pickId = (savedStore && App.multiStore.storeData[savedStore]) ? savedStore : data[0].store_id;
          App.multiStore.activeStoreId = pickId;
          const pickMeta = App.multiStore.stores.find(s => s.id === pickId);
          _suppressCloudPush = true;
          applyStoreSnapshot(App.multiStore.storeData[pickId], pickMeta);
          syncBoundLineEmployee();
          if (!App.hr.editingId) App.hr.form = makeEmptyHrForm(App.hr.form.nationalityType || 'LOCAL');
          _suppressCloudPush = false;
          App.billing.storeCount = Math.max(App.billing.storeCount, App.multiStore.stores.length);
        } else {
          // 雲端尚無資料，自動上傳目前分店作為初始資料
          App.multiStore.storeData[App.multiStore.activeStoreId] = captureActiveStoreSnapshot();
          App.cloud.status = 'SYNCED';
          for (const stMeta of App.multiStore.stores) {
            await pushStoreToCloud(stMeta.id);
          }
        }

        // 訂閱即時同步頻道（手機 LINE 打卡/請假 → 電腦後台 1 秒同步）
        _sbChannel = _sbClient
          .channel('shiftcraft-' + App.multiStore.brandId)
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'shiftcraft_stores',
            filter: `brand_id=eq.${App.multiStore.brandId}`,
          }, async (payload) => {
            const row = payload.new;
            if (!row || row.updated_by === CLOUD_CLIENT_ID) return;
            const decPayload = await decryptStorePayload(row.payload, App.multiStore.brandId);
            const exists = App.multiStore.stores.find(s => s.id === row.store_id);
            if (!exists) {
              App.multiStore.stores.push({ id: row.store_id, name: row.store_name, city: row.city || '' });
            } else {
              exists.name = row.store_name;
              exists.city = row.city || '';
            }
            App.multiStore.storeData[row.store_id] = decPayload;
            if (row.store_id === App.multiStore.activeStoreId) {
              _suppressCloudPush = true;
              applyStoreSnapshot(decPayload, exists || { id: row.store_id, name: row.store_name });
              App.cloud.lastSyncedAt = new Date().toLocaleTimeString('zh-TW', { hour12: false });

    async function updateAccountPassword(e) {
      e.preventDefault();
      const p = App.auth.pwdDraft;
      const pwCheck = evaluatePasswordStrength(p.next, App.auth.email);
      if (!pwCheck.ok) {
        App.toast = '新密碼強度不足：' + pwCheck.errors.join('、') + '。';
        render();
        return;
      }
      if (p.next !== p.confirm) { App.toast = '兩次輸入的新密碼不一致，請重新確認。'; render(); return; }
      if (!App.auth.isDemo && App.auth.email) {
        if (!p.current) { App.toast = '請先輸入「目前密碼」以驗證身分。'; render(); return; }
        const sb = getAccountSupabaseClient();
        if (sb) {
          try {
            const normEmail = App.auth.email.trim().toLowerCase();
            const { data: acc, error: selErr } = await sb
              .from('shiftcraft_accounts')
              .select('password_hash')
              .eq('email', normEmail)
              .maybeSingle();
            if (selErr) throw selErr;
            if (acc && acc.password_hash) {
              const ver = await verifyAccountPassword(normEmail, p.current, acc.password_hash);
              if (!ver.valid) {
                App.toast = '目前密碼不正確，無法變更密碼。';
                render();
                return;
              }
            }
            const newHash = await hashAccountPassword(normEmail, p.next);
            const { error } = await sb
              .from('shiftcraft_accounts')
              .update({ password_hash: newHash })
              .eq('email', normEmail);
            if (error) throw error;
          } catch (err) {
            App.toast = '密碼更新失敗，請稍後再試：' + (err.message || err);
            render();
            return;
          }
        }
      }
      App.auth.weakPasswordWarning = false;
      App.auth.pwdDraft = { current: '', next: '', confirm: '' };
      App.toast = '✅ 已升級為高強度加密密碼（PBKDF2 10 萬次加鹽雜湊），下次登入請使用新密碼。';
      render();
    }

    // 4. 核心商業邏輯函式 (完整保留所有計算與跨模組連動)

    function evalSchedule() {
      const issues = [];
      const summaries = {};
      let totalHours = 0, shiftCost = 0, otCost = 0;

      for (const emp of getSchedulableEmployees()) {
        const weekDays = getVisibleWeekDays();
        const empShifts = weekDays.map(f =>
          App.sched.shifts.find(s => s.employeeId === emp.id && s.date === f.date) ||
          { employeeId: emp.id, date: f.date, shiftCode: 'OFF_REST', station: (emp.stations && emp.stations[0]) || '', aiReason: '待排班' }
        );
        let h = 0, days = 0, streak = 0, maxStreak = 0, hasErr = false;

        for (let i = 0; i < empShifts.length; i++) {
          const cur = empShifts[i];
          const tpl = SHIFT_TEMPLATES[cur.shiftCode];
          if (!tpl.isOff) { days++; h += getShiftNetHours(cur); streak++; if (streak > maxStreak) maxStreak = streak; }
          else streak = 0;

          if (i > 0) {
            const prev = empShifts[i - 1];
            const pTpl = SHIFT_TEMPLATES[prev.shiftCode];
            if (!pTpl.isOff && !tpl.isOff) {
              const pSegs = getShiftSegments(prev);
              const cSegs = getShiftSegments(cur);
              const pEnd = pSegs.length ? pSegs[pSegs.length - 1].end : pTpl.endHour;
              const cStart = cSegs.length ? cSegs[0].start : tpl.startHour;
              const restH = 24 - pEnd + cStart;
              if (restH < 11) {
                hasErr = true;
                issues.push({
                  severity: 'ERROR', law: '勞基法第 34 條 (輪班間隔≥11h)', empId: emp.id, date: cur.date,
                  title: `${emp.name} 跨日輪班僅休息 ${restH.toFixed(1)}h（未滿 11 小時）`,
                  fix: `AI 可自動將 ${cur.date.slice(5)} 改為晚班，使休息間隔增至 15.5h。`
                });
              }
            }
          }
        }
        if (maxStreak >= 7) {
          hasErr = true;
          issues.push({
            severity: 'ERROR', law: '勞基法第 36 條 (一例一休禁連七)', empId: emp.id, date: '2026-11-29',
            title: `${emp.name} 本週連續出勤達 ${maxStreak} 天`,
            fix: 'AI 可自動於週四與週日排入休息日/例假，由多能工莎莉與鄭宇翔補位內場。'
          });
        }
        if (emp.nationalityType === 'FOREIGN' && emp.foreignStatusType === 'STUDENT_PT' && h > 20) {
          issues.push({
            severity: 'WARNING', law: '就服法第 50 條提醒（不鎖定排班）', empId: emp.id, date: '',
            title: `僑外生 ${emp.name} 本週排定 ${h.toFixed(1)}h（超過學期中 20h 參考線）`,
            fix: '僅提醒店長留意（寒暑假不限，系統已開放自由排班不強制鎖定）。'
          });
        }
        const otH = Math.max(0, h - 40);
        const empOtPay = Math.round(otH * emp.hourlyRate * 1.34);
        const pay = Math.round(Math.min(40, h) * emp.hourlyRate) + empOtPay;
        totalHours += h; shiftCost += pay; otCost += empOtPay;
        summaries[emp.id] = { hours: h, days, pay, hasErr };
      }
      const overhead = getWeeklyFixedOverheadCost();
      const overheadCost = overhead.totalWeekly;
      const totalCost = shiftCost + overheadCost;
      const manualRev = Number(App.sched && App.sched.weeklyRevenue) || 0;
      const totalRev = manualRev > 0 ? manualRev : (App.auth && App.auth.isDemo ? FORECASTS.reduce((a, b) => a + b.revenue, 0) : 0);
      return { issues, summaries, totalHours, shiftCost, overheadCost, overhead, totalCost, otCost, totalRev, ratio: totalRev > 0 ? ((totalCost / totalRev) * 100).toFixed(1) : null };
    }

    const WEEKDAY_LABELS_ZH = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    function _fmtYmd(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function _parseYmd(s) {
      const [y, m, d] = String(s || '2026-11-23').split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }
    function getVisibleWeekDays() {
      const offset = Number(App.sched && App.sched.weekOffset) || 0;
      const base = _parseYmd('2026-11-23'); // 週一基準日
      base.setDate(base.getDate() + offset * 7);
      const out = [];
      for (let i = 0; i < 7; i++) {
        const dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
        const dateStr = _fmtYmd(dt);
        const known = FORECASTS.find(f => f.date === dateStr);
        const dow = dt.getDay(); // 0=日..6=六
        out.push({
          date: dateStr,
          dayLabel: WEEKDAY_LABELS_ZH[dow],
          shortDate: `${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}`,
          isPeak: dow === 5 || dow === 6 || dow === 0,
          revenue: known ? known.revenue : 0,
          dowIdx: (dow + 6) % 7, // 0=週一..6=週日 (對齊 closedWeekdays)
        });
      }
      return out;
    }
    function getMonthCalendarDays(anchorDateStr) {
      const anchor = _parseYmd(anchorDateStr || App.sched.selectedDate || '2026-11-23');
      const y = anchor.getFullYear(), m = anchor.getMonth();
      const total = new Date(y, m + 1, 0).getDate();
      const days = [];
      for (let day = 1; day <= total; day++) {
        const dt = new Date(y, m, day);
        const dow = dt.getDay();
        days.push({
          date: _fmtYmd(dt),
          dayNum: day,
          dayLabel: WEEKDAY_LABELS_ZH[dow],
          shortDate: `${String(m + 1).padStart(2, '0')}/${String(day).padStart(2, '0')}`,
          isPeak: dow === 5 || dow === 6 || dow === 0,
          dowIdx: (dow + 6) % 7,
        });
      }
      return { year: y, month: m + 1, days };
    }
    function shiftSchedWeek(delta) {
      App.sched.weekOffset = (Number(App.sched.weekOffset) || 0) + delta;
      const wDays = getVisibleWeekDays();
      App.sched.selectedDate = wDays[0].date;
      render();
    }
    function jumpSchedToDate(dateStr) {
      const target = _parseYmd(dateStr);
      const base = _parseYmd('2026-11-23');
      const diffDays = Math.floor((target - base) / 86400000);
      App.sched.weekOffset = Math.floor(diffDays / 7);
      App.sched.selectedDate = dateStr;
      App.sched.viewMode = 'DAY_TIMELINE';
      render();
    }

      }).filter(Boolean);
      if (chips.length === 0) return '';
      return `<div class="flex flex-wrap gap-1 mt-1">${chips.join('')}</div>`;
    }

    function copyPrevWeekSchedule() {
      const curDays = getVisibleWeekDays();
      const prevDates = curDays.map(d => {
        const dt = _parseYmd(d.date);
        dt.setDate(dt.getDate() - 7);
        return _fmtYmd(dt);
      });
      const sourceShifts = App.sched.shifts.filter(s =>
        prevDates.includes(s.date) && s.shiftCode && SHIFT_TEMPLATES[s.shiftCode] && !SHIFT_TEMPLATES[s.shiftCode].isOff
      );
      if (sourceShifts.length === 0) {
        App.toast = `前一週（${prevDates[0].slice(5)} – ${prevDates[6].slice(5)}）尚未有排班紀錄可供複製。`;
        render();
        return;
      }
      let copied = 0;
      curDays.forEach((d, idx) => {
        if (getEffectiveDayConfig(d.date).isClosed) return;
        const srcDate = prevDates[idx];
        App.employees.forEach(emp => {
          const src = App.sched.shifts.find(s => s.employeeId === emp.id && s.date === srcDate);
          if (!src || !SHIFT_TEMPLATES[src.shiftCode] || SHIFT_TEMPLATES[src.shiftCode].isOff) return;
          const existing = App.sched.shifts.find(s => s.employeeId === emp.id && s.date === d.date);
          const clone = { ...JSON.parse(JSON.stringify(src)), date: d.date, aiReason: '複製前一週班表' };
          if (existing) Object.assign(existing, clone);
          else App.sched.shifts.push(clone);
          copied++;
        });
      });
      App.toast = `📋 已複製前一週班表至本週（${curDays[0].shortDate}–${curDays[6].shortDate}），共帶入 ${copied} 筆班次！`;
      render();
    }

    function copyPrevMonthSchedule() {
      const mInfo = getMonthCalendarDays(App.sched.selectedDate);
      let copied = 0;
      mInfo.days.forEach(d => {
        if (getEffectiveDayConfig(d.date).isClosed) return;
        // 依「相同星期幾（28 天前）」對齊複製，確保週一對週一、週末對週末
        const srcDt = _parseYmd(d.date);
        srcDt.setDate(srcDt.getDate() - 28);
        const srcDate = _fmtYmd(srcDt);
        App.employees.forEach(emp => {
          const src = App.sched.shifts.find(s => s.employeeId === emp.id && s.date === srcDate);
          if (!src || !SHIFT_TEMPLATES[src.shiftCode] || SHIFT_TEMPLATES[src.shiftCode].isOff) return;
          const existing = App.sched.shifts.find(s => s.employeeId === emp.id && s.date === d.date);
          const clone = { ...JSON.parse(JSON.stringify(src)), date: d.date, aiReason: '複製前一個月班表' };
          if (existing) Object.assign(existing, clone);
          else App.sched.shifts.push(clone);
          copied++;
        });
      });
      if (copied === 0) {

    function fmtHour(h) {
      const norm = ((Number(h) || 0) % 24 + 24) % 24;
      const hh = Math.floor(norm);
      const mm = Math.round((norm - hh) * 60);
      if (mm === 60) return `${String((hh + 1) % 24).padStart(2, '0')}:00`;
      return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function fmtDurationZh(hours) {
      if (!hours || hours <= 0) return '休假';
      const hh = Math.floor(hours);
      const mm = Math.round((hours - hh) * 60);
      return mm > 0 ? `${hh}h ${mm}m` : `${hh}h`;
    }

    function getStoreScheduleAxis() {
      const st = App.storeSettings || {};
      const start = Number.isFinite(Number(st.scheduleStartHour)) ? Math.max(0, Math.min(23, Number(st.scheduleStartHour))) : 8;
      const rawEnd = Number.isFinite(Number(st.scheduleEndHour)) ? Math.max(1, Math.min(24, Number(st.scheduleEndHour))) : 23;
      const is24h = start === 0 && rawEnd === 24;
      const end = is24h ? 24 : (rawEnd <= start ? rawEnd + 24 : rawEnd);
      const span = Math.max(4, end - start);
      const step = span > 14 ? 2 : 1;
      const ticks = [];
      for (let h = start; h < end; h += step) ticks.push(h);
      const endLabel = end === 24 ? '24:00' : `${String(end % 24).padStart(2, '0')}:00${end > 24 ? ' (+1)' : ''}`;
      const label = is24h
        ? '00:00–24:00 (24小時)'
        : `${String(start).padStart(2, '0')}:00–${endLabel}`;
      return { start, end, rawEnd, span, step, ticks, endLabel, is24h, isOvernightWindow: end > 24, label };
    }

      if (!shift) return [];
      const tpl = SHIFT_TEMPLATES[shift.shiftCode];
      if (!tpl || tpl.isOff) return [];
      if (shift.customStart != null && shift.customEnd != null) {
        const st = Number(shift.customStart);
        let en = Number(shift.customEnd);
        if (en <= st) en += 24;
        const isOvernight = en > 24;
        return [{ start: st, end: en, isOvernight, label: `${fmtHour(st)}–${fmtHour(en)}${isOvernight ? ' (+1)' : ''}` }];
      }
      if (shift.shiftCode === 'SPLIT' && tpl.startHour === 10.5 && tpl.endHour === 21.5 && String(tpl.name || '').includes('兩頭班')) {
        return [{ start: 10.5, end: 14.5, isOvernight: false, label: '10:30–14:30' }, { start: 17.5, end: 21.5, isOvernight: false, label: '17:30–21:30' }];
      }
      const isOvernight = tpl.endHour > 24;
      return [{ start: tpl.startHour, end: tpl.endHour, isOvernight, label: `${fmtHour(tpl.startHour)}–${fmtHour(tpl.endHour)}${isOvernight ? ' (+1)' : ''}` }];

        const span = Math.max(0, en - st);

      return tpl.netHours;

    function applyWatermark(srcUrl, enabled, cb) {
      if (!enabled) { cb(srcUrl); return; }
      const img = new Image();
      img.onload = () => {
        const maxW = 1400;
        const origW = img.width || 800, origH = img.height || 520;
        const scale = origW > maxW ? (maxW / origW) : 1;
        const w = Math.round(origW * scale), h = Math.round(origH * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const storeName = (App.storeSettings && App.storeSettings.name) || (App.auth && App.auth.companyName) || '本門市';
        const today = new Date().toISOString().slice(0, 10);
        const wmText = `僅供 ${storeName} 人事建檔與勞健保申報使用・禁止轉作他用・${today}`;
        const fontSize = Math.max(15, Math.round(w * 0.026));
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.rotate(-0.34);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = 'rgba(185, 28, 28, 0.28)';
        ctx.textAlign = 'center';
        const stepY = Math.max(64, Math.round(fontSize * 3.4));
        for (let y = -h; y <= h; y += stepY) {
          ctx.fillText(wmText, 0, y);
        }
        ctx.restore();
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = srcUrl;
    }

    let _tesseractLoadPromise = null;
    function ensureTesseractLoaded() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      if (_tesseractLoadPromise) return _tesseractLoadPromise;
      _tesseractLoadPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = () => resolve(window.Tesseract);
        s.onerror = () => reject(new Error('OCR 引擎載入失敗'));
        document.head.appendChild(s);
      });
      return _tesseractLoadPromise;
    }

    function parseTaiwanBirthDate(text) {
      const clean = String(text || '').replace(/\s+/g, '');
      // 1. 民國年格式：民國85年5月12日 或 85/05/12 → 直接保留民國年 (例：085/05/12)
      const rocM = clean.match(/(?:民國)?(\d{2,3})[年./-](\d{1,2})[月./-](\d{1,2})日?/);
      if (rocM) {
        const y = parseInt(rocM[1], 10);
        const m = parseInt(rocM[2], 10);
        const d = parseInt(rocM[3], 10);
        if (y >= 15 && y <= 120 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          return `${String(y).padStart(3, '0')}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
        }
      }
      // 2. 西元年格式（外籍 ARC / 護照）：1998/09/03 或 1998-09-03 → 自動轉成民國年 (例：087/09/03)
      const adM = clean.match(/(19\d{2}|20[01]\d)[年./-](\d{1,2})[月./-](\d{1,2})日?/);
      if (adM) {
        const adYear = parseInt(adM[1], 10), m = parseInt(adM[2], 10), d = parseInt(adM[3], 10);
        const rocYear = adYear - 1911;
        if (rocYear >= 15 && rocYear <= 120 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          return `${String(rocYear).padStart(3, '0')}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
        }
      }
      return '';
    }

    function saveHrDocPhoto(docType, rawUrl) {
      applyWatermark(rawUrl, App.hr.watermark, async (url) => {
        if (docType === 'ARC_FRONT' || docType === 'ID_FRONT') App.hr.form.idFrontImg = url;
        if (docType === 'ARC_BACK' || docType === 'ID_BACK') App.hr.form.idBackImg = url;
        if (docType === 'WORK_PERMIT') App.hr.form.workPermitImg = url;
        if (docType === 'BANK_PASSBOOK') App.hr.form.bankBookImg = url;
        App.hr.scanningDoc = docType;
        App.toast = '證件已加密暫存，正在本機辨識證件文字（初次載入約 3–5 秒）…';
        render();

        try {
          const T = await ensureTesseractLoaded();
          const lang = docType === 'BANK_PASSBOOK' ? 'chi_tra+eng' : 'chi_tra+eng';
          const res = await T.recognize(rawUrl, lang);
          const text = (res && res.data && res.data.text) ? res.data.text : '';
          const f = App.hr.form;
          const found = [];

          if (docType === 'ID_FRONT' || docType === 'ARC_FRONT') {
            // 身分證 / 統一證號
            const idM = text.toUpperCase().replace(/\s+/g, '').match(/[A-Z][1289A-D]\d{8}/);
            if (idM && !f.nationalId) { f.nationalId = idM[0]; found.push('證號 ' + idM[0]); }
            // 生日（自動將民國年轉西元年）
            const bd = parseTaiwanBirthDate(text);
            if (bd && !f.birthDate) { f.birthDate = bd; found.push('生日 ' + bd); }
            // 姓名
            const nameM = text.replace(/\s+/g, '').match(/姓名[:：]?([\u4e00-\u9fa5]{2,4})/);
            if (nameM && !f.name) { f.name = nameM[1]; found.push('姓名 ' + nameM[1]); }

            const addrM = text.replace(/\s+/g, '').match(/(?:住址|地址)[:：]?([\u4e00-\u9fa5\d\-巷弄號樓之鄰里區市縣鄉鎮村段街路]{6,40})/);

          App.hr.scanningDoc = null;

    function parseClockToMins(str) {
      if (!str) return null;
      const parts = String(str).trim().split(':').map(Number);
      if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
      return parts[0] * 60 + parts[1];
    }

    function calcWorkedHoursFromPunch(inStr, outStr) {
      const im = parseClockToMins(inStr);
      const om = parseClockToMins(outStr);
      if (im === null || om === null) return 0;
      let mins = om - im;
      if (mins <= 0) mins += 1440;
      return Math.round((mins / 60) * 100) / 100;
    }

    function parseScheduledRangeForLog(log) {
      let raw = (log && log.scheduled) ? String(log.scheduled) : '';
      let m = raw.match(/(\d{1,2}:\d{2})\s*[–\-~]\s*(\d{1,2}:\d{2})/);
      if (!m && log && log.employeeId && log.date) {
        const sh = (App.sched.shifts || []).find(s => s.employeeId === log.employeeId && s.date === log.date);
        const segs = sh ? getShiftSegments(sh) : [];
        if (segs.length) {
          const first = segs[0].label.match(/(\d{1,2}:\d{2})\s*[–\-~]\s*(\d{1,2}:\d{2})/);
          const last = segs[segs.length - 1].label.match(/(\d{1,2}:\d{2})\s*[–\-~]\s*(\d{1,2}:\d{2})/);
          if (first && last) m = [raw, first[1], last[2]];
        }
      }
      if (!m) return null;
      const startMin = parseClockToMins(m[1]);
      let endMin = parseClockToMins(m[2]);
      if (startMin === null || endMin === null) return null;
      if (endMin <= startMin) endMin += 1440;
      return { startMin, endMin, startStr: m[1], endStr: m[2] };
    }

    function getAttendanceLogEvaluation(log, emp) {
      const st = App.storeSettings || {};
      const ptMode = st.ptPunchPayMode || 'ACTUAL';
      const ptGrace = Number.isFinite(Number(st.ptOvertimeGraceMins)) ? Number(st.ptOvertimeGraceMins) : 10;
      const ftNoEarlyPenalty = st.ftEarlyOutNoPenalty !== false;
      const ftAlertMins = Number.isFinite(Number(st.ftOvertimeAlertMins)) ? Number(st.ftOvertimeAlertMins) : 15;
      const range = parseScheduledRangeForLog(log);
      const inMin = parseClockToMins(log && log.clockIn);
      let outMin = parseClockToMins(log && log.clockOut);
      if (inMin !== null && outMin !== null && outMin <= inMin) outMin += 1440;
      const actualMins = (inMin !== null && outMin !== null) ? Math.max(0, outMin - inMin) : 0;
      const actualHours = Math.round((actualMins / 60) * 100) / 100;

      let earlyInMins = 0, overtimeMins = 0, earlyOutMins = 0;
      if (range && inMin !== null) earlyInMins = Math.max(0, range.startMin - inMin);
      if (range && outMin !== null) {
        overtimeMins = Math.max(0, outMin - range.endMin);
        earlyOutMins = Math.max(0, range.endMin - outMin);
      }

      let payableMins = actualMins;
      if (inMin !== null && outMin !== null && emp && emp.type === 'PT' && ptMode === 'SCHEDULE_ALIGNED' && range) {
        const effStart = (inMin < range.startMin && !log.ptEarlyInApproved) ? range.startMin : inMin;
        let effEnd = outMin;
        if (outMin > range.endMin) {
          if (overtimeMins > ptGrace && log.ptOvertimeStatus === 'APPROVED') {
            effEnd = outMin;
          } else {
            effEnd = range.endMin;
          }
        }
        payableMins = Math.max(0, effEnd - effStart);
      }
      const payableHours = Math.round((payableMins / 60) * 100) / 100;
      const needsPtOtReview = Boolean(emp && emp.type === 'PT' && ptMode === 'SCHEDULE_ALIGNED' && overtimeMins > ptGrace && !log.ptOvertimeStatus);
      const existingOtReq = (App.liff.requests || []).find(r => r.kind === 'OVERTIME' && r.employeeId === log.employeeId && r.date === log.date && r.status !== 'REJECTED');
      const needsFtOtHint = Boolean(emp && emp.type === 'FT' && overtimeMins >= ftAlertMins && !existingOtReq);
      const isFtApprovedEarlyOut = Boolean(emp && emp.type === 'FT' && earlyOutMins > 0 && ftNoEarlyPenalty);

      return {
        ptMode, ptGrace, ftNoEarlyPenalty, ftAlertMins, range,
        actualMins, actualHours, payableMins, payableHours,
        earlyInMins, overtimeMins, earlyOutMins,
        needsPtOtReview, needsFtOtHint, existingOtReq, isFtApprovedEarlyOut,
      };
    }

    function setPtLogOvertimeDecision(logId, decision) {
      const log = (App.attendance.logs || []).find(l => l.id === logId);
      if (!log) return;
      log.ptOvertimeStatus = decision;
      const emp = App.employees.find(e => e.id === log.employeeId);
      App.toast = decision === 'APPROVED'
        ? `已核准 ${emp ? emp.name : ''} (${log.date}) 超時打卡，將依實際下班時間計薪。`
        : `已設定 ${emp ? emp.name : ''} (${log.date}) 依原排班下班時間計薪。`;
      render();
    }

    function syncApprovedOvertimeToPayroll(monthKey) {
      const mk = monthKey || App.payroll.monthKey;
      const approvedPayReqs = (App.liff.requests || []).filter(r =>
        r.kind === 'OVERTIME' && r.status === 'APPROVED' && r.compensation === 'PAY' && r.date && r.date.startsWith(mk)
      );
      const byEmp = {};
      approvedPayReqs.forEach(r => {
        const h = Math.max(0, Number(r.hours) || 0);
        if (!byEmp[r.employeeId]) byEmp[r.employeeId] = { ot134: 0, ot167: 0 };
        byEmp[r.employeeId].ot134 += Math.min(2, h);
        byEmp[r.employeeId].ot167 += Math.max(0, h - 2);
      });
      Object.keys(byEmp).forEach(empId => {
        const emp = App.employees.find(e => e.id === empId);
        if (!emp) return;
        const rec = ensurePayrollAtt(mk, emp);
        rec.ot134 = Math.round(byEmp[empId].ot134 * 10) / 10;
        rec.ot167 = Math.round(byEmp[empId].ot167 * 10) / 10;
      });
    }

    function quickCreateFtOvertimeFromLog(logId, compensation) {
      const log = (App.attendance.logs || []).find(l => l.id === logId);

      const emp = App.employees.find(e => e.id === log.employeeId);

        reason: `出勤下班打卡超時 ${ev.overtimeMins} 分鐘（店長自出勤紀錄轉立加班核准）`,
        proofName: '',
        status: 'PENDING',
        managerNote: '',

        aiCheck: comp === 'COMP_OFF'
          ? `依勞基法第 32-1 條：核准後自動加入「加班補休」餘額 +${hrs}h。`
          : `依勞基法第 24 條：前 2 小時 1.34 倍、第 3 小時起 1.67 倍，核准後自動寫入當月薪資結算。`,
      });
      managerSignOff(id, 'APPROVED', false, comp);

    function evalMonthlyHolidayCompliance(monthKey) {
      const mk = monthKey || App.payroll.monthKey;
      // 僅針對真正法定國定假日與選舉日逐人判定（不含僅適用於週六日休假制之政府補假）
      const statutoryDays = TAIWAN_HOLIDAYS_2026.filter(h => h.monthKey === mk && h.kind !== '補假');
      const activeList = getActiveEmployees();
      const rows = activeList.map(emp => {
        const compTakenDates = (App.sched.shifts || [])
          .filter(s => s.employeeId === emp.id && s.date && s.date.startsWith(mk) && s.shiftCode === 'OFF_HOLIDAY_COMP')
          .map(s => s.date);
        const dayResults = statutoryDays.map(h => {
          const isStoreClosed = getEffectiveDayConfig(h.date).isClosed;
          const sh = (App.sched.shifts || []).find(s => s.employeeId === emp.id && s.date === h.date);
          const punchLog = (App.attendance.logs || []).find(l => l.employeeId === emp.id && l.date === h.date && l.clockIn && l.clockOut);
          const hasPunch = Boolean(punchLog);
          const workedHours = hasPunch ? getAttendanceLogEvaluation(punchLog, emp).payableHours : (isStoreClosed ? 0 : getShiftNetHours(sh));
          const sourceTag = hasPunch ? '實打' : '排班預估';
          if (h.kind === '選舉日' && emp.nationalityType === 'FOREIGN') {
            return {
              holiday: h,
              status: 'NO_VOTE_RIGHT',
              hours: workedHours,
              source: hasPunch ? 'PUNCH' : 'SCHED',
              label: workedHours > 0 ? '外籍無投票權・正常計薪' : '外籍無投票權',
            };
          }
          if (emp.isBackOfficeFixed && !hasPunch) {
            return {
              holiday: h,
              status: 'HOLIDAY_OFF',
              hours: 0,
              source: 'FIXED',
              label: h.kind === '選舉日' ? '後勤固定制（依法放假）' : '後勤固定制（依政府行事曆）',
            };
          }
          if (workedHours > 0) {
            return {
              holiday: h,
              status: 'DOUBLE_PAY',
              hours: workedHours,
              source: hasPunch ? 'PUNCH' : 'SCHED',
              label: emp.type === 'FT' ? `雙倍薪 +1日 (${sourceTag})` : `雙倍時薪 ${workedHours}h (${sourceTag})`,
            };
          }
          if (emp.type === 'PT') {
            return { holiday: h, status: 'PT_OFF', hours: 0, source: 'NONE', label: isStoreClosed ? '店休未出勤' : '未排班' };
          }
          // 依勞動部函釋：選舉投票日遇休息日或例假日，原即無須出勤，依法「不另予補假」
          if (h.kind === '選舉日') {
            return { holiday: h, status: 'HOLIDAY_OFF', hours: 0, source: 'NONE', label: '選舉日未出勤（不另補假）' };
          }
          // 正職 FT 國定假日未出勤：區分「國定假日放假」vs「撞門市公休／例假／休息日須補假」
          if (sh && sh.shiftCode === 'OFF_HOLIDAY') {
            return { holiday: h, status: 'HOLIDAY_OFF', hours: 0, source: 'SCHED', label: '國定假日放假' };
          }
          if (sh && sh.shiftCode === 'OFF_HOLIDAY_COMP') {
            return { holiday: h, status: 'HOLIDAY_OFF', hours: 0, source: 'SCHED', label: '國假補休' };
          }
          const reason = isStoreClosed ? '撞門市公休' : (sh && sh.shiftCode === 'OFF_REG' ? '撞例假日' : '撞休息日');
          return { holiday: h, status: 'NEED_COMP', hours: 0, reason, source: 'SCHED', label: `${reason}・須補假` };
        });
        const doublePayDates = dayResults.filter(r => r.status === 'DOUBLE_PAY').map(r => r.holiday.date);
        const doublePayHoursPT = dayResults.filter(r => r.status === 'DOUBLE_PAY').reduce((acc, r) => acc + (r.hours || 0), 0);
        const needCompDates = dayResults.filter(r => r.status === 'NEED_COMP').map(r => r.holiday.date);
        const compTakenCount = compTakenDates.length;
        const compUnresolvedCount = Math.max(0, needCompDates.length - compTakenCount);
        return { emp, dayResults, doublePayDates, doublePayHoursPT, needCompDates, compTakenDates, compTakenCount, compUnresolvedCount };
      });
      return { statutoryDays, rows };
    }

    function syncPayrollFromAttendanceLogs(monthKey) {
      const mk = monthKey || App.payroll.monthKey;
      const monthMeta = PAYROLL_MONTHS.find(m => m.key === mk) || { key: mk, label: mk };
      const statutoryMap = new Map(
        TAIWAN_HOLIDAYS_2026.filter(h => h.monthKey === mk && h.kind !== '補假').map(h => [h.date, h])
      );
      let syncedEmps = 0;
      let totalPunches = 0;
      getActiveEmployees().forEach(emp => {
        const logs = (App.attendance.logs || []).filter(l => l.employeeId === emp.id && l.date && l.date.startsWith(mk) && l.clockIn && l.clockOut);
        if (logs.length === 0) return;
        const rec = ensurePayrollAtt(mk, emp);
        let regHours = 0;
        let holHours = 0;
        const holDates = [];
        logs.forEach(l => {
          const ev = getAttendanceLogEvaluation(l, emp);
          const h = ev.payableHours;
          totalPunches++;
          const holMeta = statutoryMap.get(l.date);
          const isEligibleHoliday = Boolean(holMeta && !(holMeta.kind === '選舉日' && emp.nationalityType === 'FOREIGN'));
          if (isEligibleHoliday) {
            holHours += h;
            if (!holDates.includes(l.date)) holDates.push(l.date);
          } else {
            regHours += h;
          }
        });
        if (emp.type === 'PT') {
          rec.regH = Math.round(regHours * 100) / 100;
          rec.holidayHoursPT = Math.round(holHours * 100) / 100;
          rec.holidaysWorked = holDates;
        } else {
          rec.holidaysWorked = holDates;
        }
        rec.manualLateOverride = false;
        syncedEmps++;
      });
      syncApprovedOvertimeToPayroll(mk);
      const ptModeLabel = (App.storeSettings && App.storeSettings.ptPunchPayMode === 'SCHEDULE_ALIGNED') ? '排班對齊＋超時簽核' : '實打實計';
      if (syncedEmps === 0) {
        App.toast = `${monthMeta.label}尚無完整的上下班打卡紀錄，目前維持排班預估或手動輸入數值（已同步核准加班）。`;
      } else {
        App.toast = `✅ 已依 ${monthMeta.label} 打卡紀錄（共 ${totalPunches} 筆，PT 模式：${ptModeLabel}）自動核算 ${syncedEmps} 位員工工時、假日雙倍薪與核准加班！`;
      }
      render();
    }

    function syncHolidayPayFromSchedule(monthKey, includeUnresolvedComp) {
      const mk = monthKey || App.payroll.monthKey;
      const { rows } = evalMonthlyHolidayCompliance(mk);
      let updatedCount = 0;
      rows.forEach(r => {
        const rec = ensurePayrollAtt(mk, r.emp);
        if (r.emp.type === 'FT') {
          const payDates = [...r.doublePayDates];
          if (includeUnresolvedComp && r.compUnresolvedCount > 0) {
            r.needCompDates.slice(0, r.compUnresolvedCount).forEach(d => {
              if (!payDates.includes(d)) payDates.push(d);
            });
          }
          rec.holidaysWorked = payDates;
          updatedCount++;
        } else {
          rec.holidaysWorked = [...r.doublePayDates];
          rec.holidayHoursPT = r.doublePayHoursPT;
          updatedCount++;
        }
      });
      App.toast = includeUnresolvedComp
        ? `💰 已依排班表帶入 ${updatedCount} 位員工的國定假日雙倍薪，並將未排補假併入折發工資！`
        : `🔄 已依排班表自動帶入 ${updatedCount} 位員工的國定假日雙倍薪（未補假者可於排班表安排「國定假日補休」或按折發工資）。`;
      render();
    }

    function calcPayslip(emp, att, monthKey) {
      const mk = monthKey || App.payroll.monthKey;
      const rules = App.payroll.rules;
      const sync = getEmpAttendanceSync(emp.id, mk, att);
      const effLateM = att.manualLateOverride ? (Number(att.lateM) || 0) : sync.effectiveLateM;
      const notes = [];
      const isF = emp.nationalityType === 'FOREIGN';
      const stMeta = FOREIGN_STATUSES.find(s => s.code === emp.foreignStatusType);
      const fixedMonthly = (emp.baseSalary||0) + (emp.meal||0) + (emp.posAllow||0) + (emp.skillAllow||0) + (emp.transportAllow||0) + (emp.splitAllow||0) + (emp.attBonus||0);
      const ordRate = emp.type === 'FT' ? Number((fixedMonthly / 240).toFixed(2)) : emp.hourlyRate;

      let attBonusEarned = 0, attBonusStatus = 'NA', attBonusReason = '計時人員無固定全勤獎金';
      if (emp.type === 'FT' && (emp.attBonus || 0) > 0) {
        if ((att.personalH || 0) > 0) {
          attBonusStatus = 'LOST_LEAVE'; attBonusReason = `當月請事假 ${att.personalH}h，依工作規則取消全勤`;
        } else if (effLateM > rules.lateGraceMinutes) {
          attBonusStatus = 'LOST_LATE'; attBonusReason = `遲到累計 ${effLateM}m（逾寬限 ${rules.lateGraceMinutes}m），取消全勤`;
        } else if (rules.missedPunchDisqualifiesBonus && sync.unresolvedMissCount > 0) {
          attBonusStatus = 'HOLD_MISSED'; attBonusReason = `${sync.unresolvedMissDates.join('、')} 尚有 ${sync.unresolvedMissCount} 筆漏卡未補`;
        } else {
          attBonusEarned = emp.attBonus || 0; attBonusStatus = 'EARNED';
          attBonusReason = sync.correctedMissCount > 0 ? `已完成 ${sync.correctedMissCount} 筆補卡簽核，全額發給` : '出勤正常達標，全額發給';
        }
      }

      const basePay = emp.type === 'FT' ? (emp.baseSalary || 0) : Math.round((Number(att.regH) || 0) * emp.hourlyRate);
      const fixedAllowOnly = emp.type === 'FT' ? (emp.meal||0) + (emp.posAllow||0) + (emp.skillAllow||0) + (emp.transportAllow||0) + (emp.splitAllow||0) : 0;
      const allowTotal = fixedAllowOnly + attBonusEarned;
      const otPay = Math.ceil((att.ot1||0) * ordRate * (4/3) + (att.ot2||0) * ordRate * (5/3) + (att.rest1||0) * ordRate * (4/3) + (att.rest2||0) * ordRate * (5/3));
      let holidayPay = 0;
      const hCnt = (att.holidaysWorked || []).length;
      if (emp.type === 'FT' && hCnt > 0) holidayPay = Math.ceil(hCnt * 8 * ordRate);
      else if (emp.type === 'PT' && (Number(att.holidayHoursPT) || 0) > 0) holidayPay = Math.ceil((Number(att.holidayHoursPT) || 0) * emp.hourlyRate * 2);

      const bonusAndExtra = (Number(att.bonus) || 0) + (Number(att.extraAdd) || 0);
      const extraDeduct = Number(att.extraDeduct) || 0;
      const grossPay = basePay + allowTotal + bonusAndExtra + otPay + holidayPay;
      const laborB = emp.laborBracket || emp.bracket || 28590;
      const nhiB = emp.nhiBracket || emp.bracket || 28590;
      const companyPaysIns = Boolean(emp.companyPaysEmployeeIns);
      const laborEmp = companyPaysIns ? 0 : Math.round(laborB * 0.125 * 0.20);
      const nhiEmp = companyPaysIns ? 0 : Math.round(nhiB * 0.0517 * 0.30 * (1 + (emp.deps||0)));
      if (companyPaysIns) notes.push('依約定由公司負擔員工勞健保自負額（本月薪資不扣勞健保）');
      const pensionMandatory = !isF || Boolean(stMeta && stMeta.pension6);
      const volPenAmt = pensionMandatory ? Math.round(nhiB * (emp.volPension||0)) : 0;

      const leaveOnlyDeduct = Math.round((att.sickH || 0) * ordRate * 0.5 + (att.personalH || 0) * ordRate);
      const lateDeduct = Math.round((effLateM / 60) * ordRate);
      const missedHoldDeduct = (sync.unresolvedMissCount > 0 && rules.missedPunchHoldHours > 0) ? Math.round(sync.unresolvedMissCount * rules.missedPunchHoldHours * ordRate) : 0;
      const leaveDeduct = leaveOnlyDeduct + lateDeduct + missedHoldDeduct;

      let taxWithhold = 0;
      if (isF && !emp.isTaxResident183Days) {
        const rate = grossPay <= 44250 ? 0.06 : 0.18;
        taxWithhold = Math.round(grossPay * rate);
        notes.push(`外籍非居住者（未滿 183 天）：預扣 ${rate*100}% 所得稅 -NT$${taxWithhold.toLocaleString()}`);
      }
      if (lateDeduct > 0) notes.push(`遲到比例扣款（勞基法§22）：${effLateM}m = -NT$${lateDeduct.toLocaleString()}`);
      if (missedHoldDeduct > 0) notes.push(`漏打卡未補暫扣（${sync.unresolvedMissCount} 筆）：-NT$${missedHoldDeduct.toLocaleString()}，核准補卡後自動補發`);
      if (att.customNote && String(att.customNote).trim()) notes.push(`人事備註：${String(att.customNote).trim()}`);
      if (notes.length === 0) notes.push('完全符合 2026 台灣最低工資、勞基法加班與勞健保規範。');

      const totalDeduct = laborEmp + nhiEmp + volPenAmt + leaveDeduct + taxWithhold + extraDeduct;
      const netPay = Math.max(0, grossPay - totalDeduct);
      const employerPen6 = pensionMandatory ? Math.round(nhiB * 0.06) : 0;
      const employerIns = Math.round(laborB * 0.125 * 0.70) + Math.round(nhiB * 0.0517 * 0.60 * 1.56);
      return { emp, att, sync, effLateM, ordRate, basePay, fixedAllowOnly, attBonusEarned, attBonusStatus, attBonusReason, allowTotal, otPay, holidayPay, bonusAndExtra, extraDeduct, grossPay, laborB, nhiB, laborEmp, nhiEmp, volPenAmt, leaveOnlyDeduct, lateDeduct, missedHoldDeduct, leaveDeduct, taxWithhold, totalDeduct, netPay, employerPen6, employerCost: grossPay + employerPen6 + employerIns, pensionMandatory, notes };
    }

    // Leave & Swap
    function calcStatutoryAnnualLeaveInfo(hireDate) {
      if (!hireDate) return { days: 0, hours: 0, tenureLabel: '未填到職日' };
      const parts = String(hireDate).split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return { days: 0, hours: 0, tenureLabel: '到職日格式待確認' };
      const start = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
      if (now.getDate() < start.getDate()) months -= 1;
      if (months < 6) return { days: 0, hours: 0, tenureLabel: '未滿半年' };
      if (months < 12) return { days: 3, hours: 24, tenureLabel: '滿半年' };
      const years = Math.floor(months / 12);
      if (years < 2) return { days: 7, hours: 56, tenureLabel: '滿 1 年' };
      if (years < 3) return { days: 10, hours: 80, tenureLabel: '滿 2 年' };
      if (years < 5) return { days: 14, hours: 112, tenureLabel: `滿 ${years} 年` };
      if (years < 10) return { days: 15, hours: 120, tenureLabel: `滿 ${years} 年` };
      const days = Math.min(30, 15 + (years - 9));
      return { days, hours: days * 8, tenureLabel: `滿 ${years} 年` };
    }

    function getEffectiveAnnualLeaveInfo(emp) {
      const stat = calcStatutoryAnnualLeaveInfo(emp && emp.hireDate);
      const storeExtra = Math.max(0, Number(App.storeSettings && App.storeSettings.annualLeaveExtraDays) || 0);
      const hasCustom = emp && emp.customAnnualLeaveDays != null && emp.customAnnualLeaveDays !== '';
      const rawDays = hasCustom ? Number(emp.customAnnualLeaveDays) : (stat.days + storeExtra);
      const finalDays = Math.max(stat.days, isNaN(rawDays) ? stat.days : rawDays);
      return {
        statutoryDays: stat.days,
        tenureLabel: stat.tenureLabel,
        days: finalDays,
        hours: finalDays * 8,
        isCustom: hasCustom,
      };
    }

    function updateEmpCustomAnnualDays(empId, rawVal) {
      const emp = App.employees.find(e => e.id === empId);
      if (!emp) return;
      const stat = calcStatutoryAnnualLeaveInfo(emp.hireDate);
      const trimmed = String(rawVal == null ? '' : rawVal).trim();
      if (trimmed === '') {
        delete emp.customAnnualLeaveDays;
      } else {
        let val = Number(trimmed);
        if (isNaN(val) || val < stat.days) {
          val = stat.days;
          App.toast = `⚠️ 依勞基法第 38 條，${emp.name}（${stat.tenureLabel}）法定特休最低為 ${stat.days} 天，不可低於法定標準！`;
        }
        emp.customAnnualLeaveDays = val;
      }
      const eff = getEffectiveAnnualLeaveInfo(emp);
      emp.annualLeaveH = eff.hours;
      if (App.liff.balances[empId]) App.liff.balances[empId].annualTotal = eff.hours;
      render();
    }

    function updateEmpCompOffHours(empId, rawVal) {
      const bal = ensureLeaveBalance(empId);
      bal.compOffRemain = Math.max(0, Number(rawVal) || 0);
      render();
    }

    function ensureLeaveBalance(empId) {
      const emp = App.employees.find(e => e.id === empId) || { type: 'PT', hireDate: '' };
      const eff = getEffectiveAnnualLeaveInfo(emp);
      if (!App.liff.balances[empId]) {
        App.liff.balances[empId] = {
          annualTotal: eff.hours,
          annualUsed: 0,
          sickTotal: 240,
          sickUsed: 0,
          personalTotal: 112,
          personalUsed: 0,
          familyCareTotal: 56,
          familyCareUsed: 0,
          compOffRemain: 0,
          menstrualUsedMonth: 0,
        };
      } else {
        App.liff.balances[empId].annualTotal = eff.hours;
      }
      return App.liff.balances[empId];
    }

    function submitLiffLeaveRequest(e) {
      e.preventDefault();
      const d = App.liff.leaveDraft;
      const emp = App.employees.find(x => x.id === App.liff.empId);
      const dep = App.employees.find(x => x.id === d.deputyId);

      App.liff.requests.unshift({
        id: 'ap-' + Date.now(), kind: 'LEAVE', employeeId: emp.id, leaveType: d.leaveType, date: d.date, hours: Number(d.hours) || 8, deputyId: d.deputyId,
        summary: `${meta.label} ${d.hours} 小時｜代理：${dep ? dep.name : '門市調度'}`, reason: d.reason.trim() || '個人事務請假', proofName: d.proofName || '',
        status: 'PENDING', managerNote: '', createdAt: '剛剛 via LINE LIFF',

      App.toast = `${emp.name} 已送出「${meta.short} ${d.hours}h」申請至店長簽核中心。`;

    function submitLiffSwapRequest(e) {

      App.liff.requests.unshift({
        id: 'sw-' + Date.now(), kind: 'SWAP', employeeId: emp.id, date: d.date, deputyId: target.id,
        summary: `${d.date.slice(5)} ${myShift ? SHIFT_TEMPLATES[myShift.shiftCode].shortLabel : '休假'} ⇄ ${target.name} (${tgtShift ? SHIFT_TEMPLATES[tgtShift.shiftCode].shortLabel : '休假'})`,
        reason: d.reason.trim() || '已與同事溝通同意互調班次', proofName: '', status: 'PENDING', managerNote: '', createdAt: '剛剛 via LINE LIFF',
        aiCheck: `勞基法預檢通過：${target.name} 具備站點技能，互調後輪班間隔符合 ≥ 11 小時。`,

          : `依勞基法第 24 條：前 2 小時 1.34 倍、第 3 小時起 1.67 倍，核准後將自動同步寫入當月薪資結算。`,

    function getActiveLineApprover(targetDate) {
      const dateStr = targetDate || App.sched.selectedDate || '2026-11-28';
      const admins = (App.storeSettings && App.storeSettings.admins) || [];
      const mgr = admins.find(a => a.role === 'STORE_MANAGER' && a.active !== false)
        || admins.find(a => a.role === 'OWNER' && a.active !== false)
        || admins.find(a => a.role === 'SHIFT_LEAD' && a.active !== false)
        || { name: (App.auth && App.auth.ownerName) || '門市管理員', role: 'STORE_MANAGER' };
      const roleLabel = mgr.role === 'OWNER' ? '老闆' : mgr.role === 'SHIFT_LEAD' ? '值班副店長' : '店長';
      return { isDelegated: false, name: mgr.name, roleLabel, shiftLabel: '', managerName: mgr.name, dateStr };
    }

    function managerSignOff(reqId, decision, viaLine, overrideComp) {
      const req = App.liff.requests.find(r => r.id === reqId);
      if (!req || req.status !== 'PENDING') return;
      const ap = getActiveLineApprover(App.sched.selectedDate);
      const noteEl = document.getElementById((viaLine ? 'line-mgr-note-' : 'mgr-note-') + reqId);
      req.status = decision;
      if (viaLine) req.signedVia = 'LINE';
      req.signedBy = `${ap.name} (${ap.roleLabel})`;
      req.managerNote = (noteEl && noteEl.value.trim()) || (decision === 'APPROVED'
        ? (viaLine ? (ap.isDelegated ? `已由代理副店長 ${ap.name} 透過 LINE 核准並同步` : '已透過 LINE 核准並同步排班、假別與薪資') : '已核准，系統已同步排班、假別與薪資')
        : (viaLine ? (ap.isDelegated ? `已由代理副店長 ${ap.name} 透過 LINE 駁回` : '已透過 LINE 駁回，請另行協調') : '未核准，請另行協調'));
      const emp = App.employees.find(e => e.id === req.employeeId);
      if (decision === 'APPROVED') {
        if (req.kind === 'LEAVE') {
          const bal = ensureLeaveBalance(req.employeeId), h = Number(req.hours) || 8;
          if (req.leaveType === 'ANNUAL') { bal.annualUsed += h; if (emp) emp.annualLeaveH = Math.max(0, bal.annualTotal - bal.annualUsed); }
          else if (req.leaveType === 'SICK') { bal.sickUsed += h; const mAtt = App.payroll.attByMonth['2026-11']?.[req.employeeId]; if (mAtt) mAtt.sickH += h; }
          else if (req.leaveType === 'PERSONAL') { bal.personalUsed += h; const mAtt = App.payroll.attByMonth['2026-11']?.[req.employeeId]; if (mAtt) mAtt.personalH += h; }
          else if (req.leaveType === 'FAMILY_CARE') { bal.familyCareUsed = (bal.familyCareUsed || 0) + h; bal.personalUsed += h; }
          else if (req.leaveType === 'COMP_OFF') bal.compOffRemain = Math.max(0, bal.compOffRemain - h);
          else if (req.leaveType === 'MENSTRUAL') bal.menstrualUsedMonth += 1;
          const s = App.sched.shifts.find(x => x.employeeId === req.employeeId && x.date === req.date);
          if (s) { s.shiftCode = 'OFF_REST'; delete s.customStart; delete s.customEnd; }
          App.toast = `已核准 ${emp ? emp.name : ''} 請假，假別餘額與排班時間軸已同步更新。`;
        } else if (req.kind === 'SWAP') {
          const s1 = App.sched.shifts.find(x => x.employeeId === req.employeeId && x.date === req.date);
          const s2 = App.sched.shifts.find(x => x.employeeId === req.deputyId && x.date === req.date);
          if (s1 && s2) {
            [s1.shiftCode, s2.shiftCode] = [s2.shiftCode, s1.shiftCode];
            [s1.station, s2.station] = [s2.station, s1.station];
            [s1.customStart, s2.customStart] = [s2.customStart, s1.customStart];
            [s1.customEnd, s2.customEnd] = [s2.customEnd, s1.customEnd];
          }
          App.toast = `已核准調班，${req.date.slice(5)} 排班時間條已即時互換。`;
        } else if (req.kind === 'OVERTIME') {
          const comp = overrideComp || req.compensation || 'PAY';
          req.compensation = comp;
          const h = Math.max(0, Number(req.hours) || 0);
          req.summary = `加班 ${h} 小時｜${comp === 'COMP_OFF' ? '轉加班補休 (1:1)' : '領加班費 (1.34/1.67倍)'}`;
          if (comp === 'COMP_OFF') {
            const bal = ensureLeaveBalance(req.employeeId);
            if (!req.compOffCredited) {
              bal.compOffRemain = Math.round(((Number(bal.compOffRemain) || 0) + h) * 10) / 10;
              req.compOffCredited = true;
            }
            App.toast = `已核准 ${emp ? emp.name : ''} 加班 ${h}h，已自動加入「加班補休」餘額（目前 ${bal.compOffRemain}h）。`;
          } else {
            const mk = (req.date || App.payroll.monthKey || '2026-11').slice(0, 7);
            syncApprovedOvertimeToPayroll(mk);
            App.toast = `已核准 ${emp ? emp.name : ''} 加班 ${h}h（領加班費），已同步寫入 ${mk} 薪資結算。`;
          }
        }
      } else { App.toast = `已駁回 ${emp ? emp.name : ''} 之申請。`; }
      render();
    }

    function openLineManagerApproval(filter) {
      App.liffRole = 'MANAGER';
